function buildBuses(bks,max,tourId,date){
  const BUS_LABELS=['A','B','C','D','E','F'];
  const manualBuses={};  // busIdx -> booking[]
  const unassigned=[];   // booking[]（未手動指定）

  bks.forEach(b=>{
    const idx=tourId?getBusIdx(tourId,date,b.id):null;
    if(idx!==null&&idx!==undefined){
      if(!manualBuses[idx]) manualBuses[idx]=[];
      manualBuses[idx].push(b);
    } else {
      unassigned.push(b);
    }
  });

  // 自動分配未指定的 booking（整組不拆，塞入第一台放得下的車）
  // 若整組人數超過 max，仍放同一台（邊界情況，顯示超載警告）
  unassigned.forEach(b=>{
    let placed=false;
    // 從 0 號車找起，找第一台「已有人數 + 此 booking 人數 <= max」的車
    for(let i=0;;i++){
      const cur=manualBuses[i]||[];
      const curPax=cur.reduce((s,x)=>s+x.count,0);
      if(curPax+b.count<=max){
        if(!manualBuses[i]) manualBuses[i]=[];
        manualBuses[i].push(b);
        placed=true;
        break;
      }
      // 已滿，試下一台；若超過合理上限（F車）就強制放到最後一台
      if(i>=5){ 
        if(!manualBuses[i]) manualBuses[i]=[];
        manualBuses[i].push(b);
        placed=true;
        break;
      }
    }
  });

  const sortedIdxs=[...new Set(Object.keys(manualBuses).map(Number))].sort((a,b)=>a-b);
  return sortedIdxs.map(i=>({
    busIdx:i,
    label:BUS_LABELS[i]||String(i+1),
    bookings:manualBuses[i]||[],  // booking 層級（保留原始 count）

  }));
}

function extSessAck(){
  const v=window._extSnap,list=[];
  const base=v?v.sessAck:(window._extDisp&&window._extDisp.sessAck);

}

        ${remitBox(shouldRemit)}
      </div>
      <div style="font-size:11px;color:var(--text2);margin-top:6px">應回帳＝客收－代付客房尾款${privExAdv?'－附加費用代付':''}－外派車資－外宿補貼${waive?'－公司免回帳'+(d.remitWaiveNote?'（'+d.remitWaiveNote+'）':''):''}</div>
      ${splitNote}
      ${balance<=0&&!priorReports.length?EXT_NO_BALANCE_NOTE:`<div style="margin:14px 0 6px;padding:8px 10px;border:2px solid ${priorTotal>=balance?'var(--green)':'var(--red)'};background:${priorTotal>=balance?'var(--green-l)':'var(--red-l)'};border-radius:8px;font-size:13px;color:var(--text)">${priorTotal>=balance?'<strong style="color:var(--green-d)">✅ 尾款已通知公司，謝謝！</strong>':'<strong style="color:var(--red-d)">💰 收到客人尾款後</strong>，請填金額並按「已收到尾款」，公司才知道已經收了。'}</div>
      ${extPriorListHtml(priorReports,false)}
      <div style="display:${settled||balance<=0?'none':'flex'};gap:6px;margin-bottom:14px">
        <input type="number" id="ext-inc-amt" value="${Math.max(balance-priorTotal,0)}" style="flex:1;height:34px;font-size:13px" placeholder="收到的金額">
        <button class="btn btn-primary btn-sm" onclick="reportPrivIncome('${p.id}','${d.driverId}','${(d.driverName||'').replace(/'/g,"\\'")}')" style="font-weight:700;white-space:nowrap">已收到尾款</button>
      </div>`}
      ${extRemitSectionHtml('priv',p.id,shouldRemit,d.driverId,d.driverName,'reportPrivRemit')}
      ${disclaimer}
    `;
  } else if(d.groupTourId){
    const m=d.groupTourId.match(/^(.+)_(\d{4}-\d{2}-\d{2})_bus(\d+)$/);
    if(!m){el.innerHTML='<div class="empty">找不到對應的行程資料</div>';return;}
    const tourId=m[1],date=m[2],busIdx=parseInt(m[3]);
    const t=tours.find(x=>x.id===tourId);
    const dateBks=bookings.filter(b=>b.tourId===tourId&&b.date===date);
    const buses=buildBuses(dateBks,t?.busMax||8,tourId,date);
    const myBus=buses.find(b=>b.busIdx===busIdx);
    const bks=window._extSnap?bookings:(myBus?.bookings||[]); // 快照內只存這台車的乘客
    const custRows=bks.map(b=>({bookingId:b.id,name:b.name,count:b.count,balance:calcBookingBalance(b)}));
    const totalBalance=custRows.reduce((s,r)=>s+r.balance,0);
    const gn=getGroupNightly(tourId,date,busIdx);
    let hotelAdvance=0;
    if(window._extSnap){hotelAdvance=window._extSnap.hotelAdvance||0;}
    else hotelAdvance=calcGroupHotelAdvance(gn);
    const outwage=d.outwage||0;
    // 附加費用（門票、餐食等，依本車人數計算）由司機現場代付
    // 外派頁：快照有就用快照；舊快照沒有這欄時，直接用快照內的行程設定＋本車乘客人數計算（不必等管理頁重建快照）
    const busPaxCount=bks.reduce((s,b)=>s+(b.count||0),0);
    const extraItems=(window._extSnap&&window._extSnap.extraItems&&window._extSnap.extraItems.length)
      ?window._extSnap.extraItems
      :calcGroupBusExtras(t,window._extSnap?busPaxCount:(myBus?.seats||0));
    const extraAdvance=extraItems.reduce((s,x)=>s+x.amount,0);
    const waive=dispWaive(d);
    const shouldRemit=totalBalance-hotelAdvance-extraAdvance-outwage-nightAllow-waive;
    // 拼團結束日：派車結束日，沒有的話用出發日＋天數推算
    const grpEnd=d.end||(()=>{const x=new Date(date);x.setDate(x.getDate()+Math.max((t?.days||1)-1,0));return x.toISOString().slice(0,10);})();
    const settled=extIsSettled('group',d.groupTourId,shouldRemit,waive,grpEnd);
    const extrasHtml=extraItems.length?`<div style="margin-bottom:10px;padding:8px 10px;background:var(--amber-l);border:1px solid var(--amber);border-radius:8px">
        <div style="font-size:12px;color:var(--amber-d);margin-bottom:4px;font-weight:600">附加費用（請現場代付）</div>
        ${extraItems.map(x=>`<div style="display:flex;justify-content:space-between;font-size:13px;padding:2px 0;gap:8px;color:#5C3A00"><span>${x.name}　<span style="font-size:11px;color:#8A6A3A">(${x.detail})</span></span><strong style="color:var(--amber-d)">$${x.amount.toLocaleString()}</strong></div>`).join('')}
        <div style="display:flex;justify-content:space-between;font-size:13px;padding-top:4px;margin-top:4px;border-top:1px solid var(--amber);color:#5C3A00"><span>合計</span><strong>$${extraAdvance.toLocaleString()}</strong></div>
      </div>`:'';
    el.innerHTML=`
      ${settled?'':extSessBoxHtml(d)}
      <div style="font-size:12px;color:var(--text2)">行程</div>
      <div style="font-size:18px;font-weight:700;margin-bottom:4px">${t?.name||d.label||'-'}</div>
      <div style="font-size:13px;color:var(--text2);margin-bottom:14px">${date}｜<strong style="color:var(--text)">本車 ${bks.reduce((s,b)=>s+(b.count||0),0)} 人</strong>${d.car?'｜'+d.car:''}</div>
      ${settled?EXT_SETTLED_BANNER:`
      ${t?.desc?`<div style="margin-bottom:12px"><div style="font-size:12px;font-weight:600;margin-bottom:4px">行程內容</div><pre style="font-family:inherit;white-space:pre-wrap;font-size:13px;margin:0;padding:8px 10px;background:var(--bg2);border-radius:8px;color:var(--text)">${t.desc}</pre></div>`:''}
      ${(()=>{
        const gh=window._extSnap?(window._extSnap.groupHotels||[]):groupBusHotelRows(tourId,date,busIdx);
        if(!gh.length)return '';
        const allow=window._extSnap?(window._extSnap.remitNight||0):calcRemitNightAllowance(d);
        return `<div style="margin-bottom:14px">${nightCardsHtml(gh,{showPay:true,allow})}</div>`;
      })()}
      ${custRows.length?`${(()=>{const _todo=custRows.filter(r=>r.balance>0&&!driverRecs.some(rec=>rec.type==='income'&&rec.relatedBookingIds?.includes(r.bookingId)));return _todo.length?`<div style="margin-bottom:8px;padding:8px 10px;border:2px solid var(--red);background:var(--red-l);border-radius:8px;font-size:13px;color:var(--text)"><strong style="color:var(--red-d)">💰 還有 ${_todo.length} 位客人的尾款沒通知</strong><br>收到客人尾款後，請按該客人旁的「已收到尾款」，公司才知道已經收了。</div>`:'';})()}<div style="font-size:12px;font-weight:600;margin-bottom:4px">客人尾款明細</div>
      <div class="tbl-wrap" style="margin-bottom:10px"><table class="xtable"><thead><tr><th>客人</th><th style="text-align:center">人數</th><th style="text-align:right">尾款</th><th></th></tr></thead><tbody>${custRows.map(r=>{
        const repRec=driverRecs.find(rec=>rec.type==='income'&&rec.relatedBookingIds?.includes(r.bookingId));
        const nameEsc=(r.name||'').replace(/'/g,"\\'");
        const action=repRec
          ?`<div style="font-size:12px;white-space:nowrap"><span style="color:var(--green)"><i class="ti ti-check"></i> 已通知</span><div style="font-size:11px">${extRecStatusHtml(repRec)}</div></div>`
          :(r.balance>0?`<button class="btn btn-sm btn-primary" onclick="reportGroupIncome('${r.bookingId}','${nameEsc}',${r.balance},'${d.driverId}','${(d.driverName||'').replace(/'/g,"\\'")}')" style="font-weight:700;white-space:nowrap">已收到尾款</button>`:'<span style="font-size:12px;color:var(--text2);white-space:nowrap">已付清・免通知</span>');
        return `<tr><td style="font-size:12px">${r.name}</td><td style="text-align:center">${r.count}</td><td style="text-align:right">$${r.balance.toLocaleString()}</td><td>${action}</td></tr>`;
      }).join('')}</tbody></table></div>`:'<div class="empty" style="padding:8px;margin-bottom:10px">目前這車次尚無報名資料</div>'}
`}
      ${custRows.length&&totalBalance<=0?EXT_NO_BALANCE_NOTE:''}
      ${extrasHtml}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        ${statBox('客收合計',totalBalance)}
        ${statBox('代付客房尾款',hotelAdvance,'var(--red)')}
        ${extraAdvance?statBox('附加費用代付',extraAdvance,'var(--red)'):''}
        ${statBox('您的外派車資',outwage,'var(--green)')}
        ${statBox('外宿補貼',nightAllow,'var(--green)')}
        ${waive?statBox('公司免回帳',waive,'var(--green)'):''}
        ${remitBox(shouldRemit)}
      </div>
      <div style="font-size:11px;color:var(--text2);margin-top:6px">應回帳＝客收合計－代付客房尾款${extraAdvance?'－附加費用代付':''}－外派車資－外宿補貼${waive?'－公司免回帳'+(d.remitWaiveNote?'（'+d.remitWaiveNote+'）':''):''}</div>
      ${extRemitSectionHtml('group',d.groupTourId,shouldRemit,d.driverId,d.driverName,'reportGroupRemit')}
      ${disclaimer}
    `;
  } else {
    el.innerHTML=`
      <div style="font-size:18px;font-weight:700;margin-bottom:4px">${d.label||'-'}</div>
      <div style="font-size:13px;color:var(--text2);margin-bottom:14px">${d.start}${d.start!==d.end?'～'+d.end:''}${d.car?'｜'+d.car:''}</div>
      ${dispTimeText(d)?`<div style="font-size:14px;font-weight:600;color:var(--blue-d);margin:-8px 0 14px">🕗 ${dispTimeText(d)}</div>`:''}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${statBox('您的外派車資',d.outwage||0,'var(--green)')}${(d.nightAllowance||0)>0?statBox('外宿補貼',d.nightAllowance,'var(--green)'):''}</div>
      ${disclaimer}
    `;
  }
}
function extFmtTime(iso){return twFmt(iso,true)||iso||'-';}
// -- external link entry --
const extToken=new URLSearchParams(location.search).get('ext');
if(extToken){enterExternalMode(extToken);}
else{document.getElementById('ext-screen').style.display='flex';document.getElementById('ext-content').innerHTML='<div class="empty">連結無效或已過期，請跟公司確認</div>';}
</script>
</body>
</html>
