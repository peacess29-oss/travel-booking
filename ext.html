.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}

.fin-section.open{display:block}

<script>
const FIREBASE_CONFIG={apiKey:"AIzaSyAaLeoi0fR2o8bXimtPmlKvBtKjIrGdgX8",authDomain:"travel-booking-89df8.firebaseapp.com",projectId:"travel-booking-89df8",storageBucket:"travel-booking-89df8.firebasestorage.app",messagingSenderId:"436528685102",appId:"1:436528685102:web:a090cdf0cf9875ceddbfbf"};
firebase.initializeApp(FIREBASE_CONFIG);
const db=firebase.firestore();
let tours=[],bookings=[],privates=[],dispatches=[],drivers=[],hotels=[],expenses=[],driverRecs=[],fixedExpenses=[],groupNightlies=[],groupStatus={},carsList=['5201','RFT-2692','9713','8680'],costSettings={driverDayRate:5000,driverNightRate:1000};
const TW_HOL=new Set(['2025-01-01','2025-01-27','2025-01-28','2025-01-29','2025-01-30','2025-01-31','2025-02-28','2025-04-03','2025-04-04','2025-04-05','2025-05-01','2025-05-31','2025-06-01','2025-09-07','2025-10-10','2025-10-11','2026-01-01','2026-02-16','2026-02-17','2026-02-18','2026-02-19','2026-02-20','2026-02-28','2026-04-04','2026-04-05','2026-05-01','2026-06-19','2026-06-20','2026-09-25','2026-09-26','2026-10-10']);
const TW_MKP=new Set(['2025-01-23','2025-04-02']);
function isHol(d){const w=new Date(d).getDay();if(TW_HOL.has(d))return true;if(TW_MKP.has(d))return false;return w===0||w===6;}
function calcBookingBalance(b){
  if(typeof b.balance==='number')return b.balance;
  const t=tours.find(x=>x.id===b.tourId);
  if(!t)return 0;
  const dep=getPrice(t,b.date,'deposit'),pr=getPrice(t,b.date,'price');
  return (pr*b.count)+(b.roomCost||0)-(dep*b.count);
}
function getPrice(t,d,f){const h=isHol(d);if(f==='deposit')return h?(t.depositWk||t.deposit||0):(t.depositWd||t.deposit||0);return h?(t.priceWk||t.price||0):(t.priceWd||t.price||0);}
let busAssignMap={};
function getBusIdx(tourId,date,bookId){
  const key=tourId+'_'+date.replace(/-/g,'')+'_'+bookId;
  return busAssignMap[key]??null; // null = 未手動指定
}
function buildBuses(bks,max,tourId,date){
  const BUS_LABELS=['A','B','C','D','E','F'];
  const manualBuses={};  // busIdx -> booking[]
  const unassigned=[];   // booking[]（未手動指定）

  bks.forEach(b=>{
    const idx=tourId?getBusIdx(tourId,date,b.id):null;
    if(idx!==null&&idx!==undefined){
      if(!manualBuses[idx]) manualBuses[idx]=[];
      manualBuses[idx].push(b);
    } else {
      unassigned.push(b);
    }
  });

  // 自動分配未指定的 booking（整組不拆，塞入第一台放得下的車）
  // 若整組人數超過 max，仍放同一台（邊界情況，顯示超載警告）
  unassigned.forEach(b=>{
    let placed=false;
    // 從 0 號車找起，找第一台「已有人數 + 此 booking 人數 <= max」的車
    for(let i=0;;i++){
      const cur=manualBuses[i]||[];
      const curPax=cur.reduce((s,x)=>s+x.count,0);
      if(curPax+b.count<=max){
        if(!manualBuses[i]) manualBuses[i]=[];
        manualBuses[i].push(b);
        placed=true;
        break;
      }
      // 已滿，試下一台；若超過合理上限（F車）就強制放到最後一台
      if(i>=5){ 
        if(!manualBuses[i]) manualBuses[i]=[];
        manualBuses[i].push(b);
        placed=true;
        break;
      }
    }
  });

  const sortedIdxs=[...new Set(Object.keys(manualBuses).map(Number))].sort((a,b)=>a-b);
  return sortedIdxs.map(i=>({
    busIdx:i,
    label:BUS_LABELS[i]||String(i+1),
    bookings:manualBuses[i]||[],  // booking 層級（保留原始 count）
    seats:(manualBuses[i]||[]).reduce((s,b)=>s+b.count,0)  // 總人數（用於成團判斷）
  }));
}
function calcGroupBusExtras(tour,pax){
  if(!tour?.extras?.length||!pax)return [];
  return tour.extras.filter(e=>e.mode!=='room'&&e.price).map(e=>{
    if(e.mode==='table'){const tables=Math.ceil(pax/(e.tableSize||8));return{name:e.name,detail:tables+'桌 × $'+e.price,amount:tables*e.price};}
    return{name:e.name,detail:pax+'人 × $'+e.price,amount:pax*e.price};
  });
}
function getHotelRoomRate(hotel,dateStr,roomType){
  if(!hotel)return 0;
  const isWeekend=isHol(dateStr);
  if(roomType==='r2')return isWeekend?(hotel.r2wk||hotel.r2||0):(hotel.r2||0);
  if(roomType==='r3')return isWeekend?(hotel.r3wk||hotel.r3||0):(hotel.r3||0);
  if(roomType==='r4')return isWeekend?(hotel.r4wk||hotel.r4||0):(hotel.r4||0);
  if(roomType==='r5')return isWeekend?(hotel.r5wk||hotel.r5||0):(hotel.r5||0);
  if(roomType==='r6')return isWeekend?(hotel.r6wk||hotel.r6||0):(hotel.r6||0);
  return 0;
}
function groupBusHotelRows(tourId,date,busIdx){
  const {gn,fromTemplate}=getGroupNightlyForDisplay(tourId,date,busIdx);
  return (gn?.nightlyHotels||[]).map((n,i)=>{
    if(!n.hotelId&&!n.finalQuote&&!n.r2&&!n.r3&&!n.r4&&!n.r5&&!n.r6)return null;
    const h=hotels.find(x=>x.id===n.hotelId);
    const nd=new Date(date);nd.setDate(nd.getDate()+i);
    const rooms=[n.r2?`雙人房×${n.r2}`:'',n.r3?`三人房×${n.r3}`:'',n.r4?`四人房×${n.r4}`:'',n.r5?`五人房×${n.r5}`:'',n.r6?`六人房×${n.r6}`:''].filter(Boolean).join('、');
    const drv=isDriverPayNight(n);
    return{dt:(nd.getMonth()+1)+'/'+nd.getDate(),name:h?h.name:'（未指定酒店）',area:h?.area||'',rooms,
      driverPay:drv&&!fromTemplate,due:drv&&!fromTemplate?nightBalanceDue(calcGroupNightQuote(gn,n,i),n):0,paid:!!n.driverPaid,paidAmt:n.driverPaidAmount||0,hasDeposit:nightDeposit(n)>0};
  }).filter(Boolean);
}
function calcNightQuote(p,nh,i){
  if(nh.finalQuote>0)return nh.finalQuote;
  const hotel=hotels.find(h=>h.id===nh.hotelId);if(!hotel)return 0;
  let nightDate='';
  if(p.start){const d=new Date(p.start);d.setDate(d.getDate()+i);nightDate=d.toISOString().slice(0,10);}
  return getHotelRoomRate(hotel,nightDate,'r2')*(nh.r2||0)+getHotelRoomRate(hotel,nightDate,'r3')*(nh.r3||0)+getHotelRoomRate(hotel,nightDate,'r4')*(nh.r4||0)+getHotelRoomRate(hotel,nightDate,'r5')*(nh.r5||0)+getHotelRoomRate(hotel,nightDate,'r6')*(nh.r6||0);
}
function nightDeposit(nh){return Math.max(0,parseInt(nh&&nh.hotelDeposit)||0);}
function nightBalanceDue(quote,nh){return Math.max(0,(quote||0)-nightDeposit(nh));}
function isDriverPayNight(nh){return (nh.paymentType||'company')==='driver';}
function nightDriverAdvance(quote,nh){
  if(!isDriverPayNight(nh))return 0;
  return nh.driverPaid?(nh.driverPaidAmount||0):nightBalanceDue(quote,nh);
}
function calcPrivHotelAdvance(p){return (p.nightlyHotels||[]).reduce((s,nh,i)=>s+nightDriverAdvance(calcNightQuote(p,nh,i),nh),0);}
function calcGroupHotelAdvance(gn){return (gn?.nightlyHotels||[]).reduce((s,nh,i)=>s+nightDriverAdvance(calcGroupNightQuote(gn,nh,i),nh),0);}
function calcRemitNightAllowance(d){
  if(!d)return 0;
  if(d.privateId){
    if((d.privateBusIdx??0)!==0)return 0;
    return dispatches.filter(x=>x.privateId===d.privateId).reduce((s,x)=>s+(x.nightAllowance||0),0);
  }
  return d.nightAllowance||0;
}
function privNightAllowanceSplit(privateId){
  return dispatches.filter(x=>x.privateId===privateId&&(x.privateBusIdx??0)!==0&&(x.nightAllowance||0)>0)
    .map(x=>({bus:String.fromCharCode(65+(x.privateBusIdx||0)),driverName:x.driverName||'-',amount:x.nightAllowance}));
}
function dispWaive(d){return Math.max(0,parseInt(d&&d.remitWaive)||0);}
function groupNightlyId(tourId,date,busIdx){return tourId+'_'+date+'_bus'+busIdx;}
function getGroupNightly(tourId,date,busIdx){return groupNightlies.find(g=>g.id===groupNightlyId(tourId,date,busIdx))||null;}
function getGroupNightlyForDisplay(tourId,date,busIdx){
  const gn=getGroupNightly(tourId,date,busIdx);
  if(gn&&(gn.nightlyHotels||[]).some(n=>n.hotelId||n.r2||n.r3||n.r4||n.r5||n.r6))return {gn,fromTemplate:false};
  const t=tours.find(x=>x.id===tourId);
  if(t?.nightlyHotels?.some(n=>n.hotelId))return {gn:{tourId,date,busIdx,nightlyHotels:t.nightlyHotels.map(n=>({...n,paymentType:'company'}))},fromTemplate:true};
  return {gn,fromTemplate:false};
}
function calcGroupNightQuote(gn,nh,i){
  if(nh.finalQuote>0)return nh.finalQuote;
  const hotel=hotels.find(h=>h.id===nh.hotelId);if(!hotel)return 0;
  let nightDate='';

    const dateBks=bookings.filter(b=>b.tourId===tourId&&b.date===date);
    const buses=buildBuses(dateBks,t?.busMax||8,tourId,date);
    const myBus=buses.find(b=>b.busIdx===busIdx);
    const bks=window._extSnap?bookings:(myBus?.bookings||[]); // 快照內只存這台車的乘客
    const custRows=bks.map(b=>({bookingId:b.id,name:b.name,count:b.count,balance:calcBookingBalance(b)}));
    const totalBalance=custRows.reduce((s,r)=>s+r.balance,0);
    const gn=getGroupNightly(tourId,date,busIdx);
    let hotelAdvance=0;
    if(window._extSnap){hotelAdvance=window._extSnap.hotelAdvance||0;}
    else hotelAdvance=calcGroupHotelAdvance(gn);
    const outwage=d.outwage||0;
    // 附加費用（門票、餐食等，依本車人數計算）由司機現場代付
    // 外派頁：快照有就用快照；舊快照沒有這欄時，直接用快照內的行程設定＋本車乘客人數計算（不必等管理頁重建快照）
    const busPaxCount=bks.reduce((s,b)=>s+(b.count||0),0);
    const extraItems=(window._extSnap&&window._extSnap.extraItems&&window._extSnap.extraItems.length)
      ?window._extSnap.extraItems
      :calcGroupBusExtras(t,window._extSnap?busPaxCount:(myBus?.seats||0));
    const extraAdvance=extraItems.reduce((s,x)=>s+x.amount,0);
    const waive=dispWaive(d);
    const shouldRemit=totalBalance-hotelAdvance-extraAdvance-outwage-nightAllow-waive;
    // 拼團結束日：派車結束日，沒有的話用出發日＋天數推算
    const grpEnd=d.end||(()=>{const x=new Date(date);x.setDate(x.getDate()+Math.max((t?.days||1)-1,0));return x.toISOString().slice(0,10);})();
    const settled=extIsSettled('group',d.groupTourId,shouldRemit,waive,grpEnd);
    const extrasHtml=extraItems.length?`<div style="margin-bottom:10px;padding:8px 10px;background:var(--amber-l);border:1px solid var(--amber);border-radius:8px">
        <div style="font-size:12px;color:var(--amber-d);margin-bottom:4px;font-weight:600">附加費用（請現場代付）</div>
        ${extraItems.map(x=>`<div style="display:flex;justify-content:space-between;font-size:13px;padding:2px 0;gap:8px;color:#5C3A00"><span>${x.name}　<span style="font-size:11px;color:#8A6A3A">(${x.detail})</span></span><strong style="color:var(--amber-d)">$${x.amount.toLocaleString()}</strong></div>`).join('')}
        <div style="display:flex;justify-content:space-between;font-size:13px;padding-top:4px;margin-top:4px;border-top:1px solid var(--amber);color:#5C3A00"><span>合計</span><strong>$${extraAdvance.toLocaleString()}</strong></div>
      </div>`:'';
    el.innerHTML=`
      <div style="font-size:12px;color:var(--text2)">行程</div>
      <div style="font-size:18px;font-weight:700;margin-bottom:4px">${t?.name||d.label||'-'}</div>
      <div style="font-size:13px;color:var(--text2);margin-bottom:14px">${date}｜<strong style="color:var(--text)">本車 ${bks.reduce((s,b)=>s+(b.count||0),0)} 人</strong>${d.car?'｜'+d.car:''}</div>
      ${settled?EXT_SETTLED_BANNER:`
      ${t?.desc?`<div style="margin-bottom:12px"><div style="font-size:12px;font-weight:600;margin-bottom:4px">行程內容</div><pre style="font-family:inherit;white-space:pre-wrap;font-size:13px;margin:0;padding:8px 10px;background:var(--bg2);border-radius:8px;color:var(--text)">${t.desc}</pre></div>`:''}
      ${(()=>{
        const gh=window._extSnap?(window._extSnap.groupHotels||[]):groupBusHotelRows(tourId,date,busIdx);
        if(!gh.length)return '';
        return `<div style="font-size:12px;font-weight:600;margin-bottom:6px">住宿安排</div><table style="width:100%;border-collapse:collapse;margin-bottom:14px">${gh.map(r=>`<tr style="border-bottom:0.5px solid var(--border)"><td style="padding:5px 0;white-space:nowrap;color:var(--text2);font-size:12px;vertical-align:top">${r.dt}</td><td style="padding:5px 0 5px 10px;font-size:13px">${r.name}${r.area?'（'+r.area+'）':''}${r.rooms?'<div style="font-size:12px;color:var(--text2)">'+r.rooms+'</div>':''}${r.driverPay?`<div style="font-size:12px;font-weight:600;color:${r.paid?'var(--green-d)':'var(--red)'}">${r.paid?'✅ 已付酒店尾款 $'+(r.paidAmt||0).toLocaleString():'💵 請現場付酒店尾款 $'+(r.due||0).toLocaleString()}${r.hasDeposit?'（訂金公司已付）':''}</div>`:''}</td></tr>`).join('')}</table>`;
      })()}
      ${custRows.length?`<div style="font-size:12px;font-weight:600;margin-bottom:4px">客人尾款明細</div>
      <div class="tbl-wrap" style="margin-bottom:10px"><table class="xtable"><thead><tr><th>客人</th><th style="text-align:center">人數</th><th style="text-align:right">尾款</th><th></th></tr></thead><tbody>${custRows.map(r=>{
        const repRec=driverRecs.find(rec=>rec.type==='income'&&rec.relatedBookingIds?.includes(r.bookingId));
        const nameEsc=(r.name||'').replace(/'/g,"\\'");
        const action=repRec
          ?`<div style="font-size:12px;white-space:nowrap"><span style="color:var(--green)"><i class="ti ti-check"></i> 已通知</span><div style="font-size:11px">${extRecStatusHtml(repRec)}</div></div>`
          :(r.balance>0?`<button class="btn btn-sm" onclick="reportGroupIncome('${r.bookingId}','${nameEsc}',${r.balance},'${d.driverId}','${(d.driverName||'').replace(/'/g,"\\'")}')">通知已客收</button>`:'-');
        return `<tr><td style="font-size:12px">${r.name}</td><td style="text-align:center">${r.count}</td><td style="text-align:right">$${r.balance.toLocaleString()}</td><td>${action}</td></tr>`;
      }).join('')}</tbody></table></div>`:'<div class="empty" style="padding:8px;margin-bottom:10px">目前這車次尚無報名資料</div>'}
`}
      ${extrasHtml}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        ${statBox('客收合計',totalBalance)}
        ${statBox('住宿尾款代付',hotelAdvance,'var(--red)')}
        ${extraAdvance?statBox('附加費用代付',extraAdvance,'var(--red)'):''}
        ${statBox('您的外派車資',outwage,'var(--green)')}
        ${statBox('外宿補貼',nightAllow,'var(--green)')}
        ${waive?statBox('公司免回帳',waive,'var(--green)'):''}
        ${remitBox(shouldRemit)}
      </div>
      <div style="font-size:11px;color:var(--text2);margin-top:6px">應回帳＝客收合計－住宿尾款代付${extraAdvance?'－附加費用代付':''}－外派車資－外宿補貼${waive?'－公司免回帳'+(d.remitWaiveNote?'（'+d.remitWaiveNote+'）':''):''}</div>
      ${extRemitSectionHtml('group',d.groupTourId,shouldRemit,d.driverId,d.driverName,'reportGroupRemit')}
      ${disclaimer}
    `;
  } else {
    el.innerHTML=`
      <div style="font-size:18px;font-weight:700;margin-bottom:4px">${d.label||'-'}</div>
      <div style="font-size:13px;color:var(--text2);margin-bottom:14px">${d.start}${d.start!==d.end?'～'+d.end:''}${d.car?'｜'+d.car:''}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${statBox('您的外派車資',d.outwage||0,'var(--green)')}${(d.nightAllowance||0)>0?statBox('外宿補貼',d.nightAllowance,'var(--green)'):''}</div>
      ${disclaimer}
    `;
  }
}
function extFmtTime(iso){const d=new Date(iso);if(isNaN(d))return iso||'-';const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+' '+z(d.getHours())+':'+z(d.getMinutes());}
// -- external link entry --
const extToken=new URLSearchParams(location.search).get('ext');
if(extToken){enterExternalMode(extToken);}
else{document.getElementById('ext-screen').style.display='flex';document.getElementById('ext-content').innerHTML='<div class="empty">連結無效或已過期，請跟公司確認</div>';}
</script>
</body>
</html>
