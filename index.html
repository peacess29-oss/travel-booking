  };
  return `<div class="scroll"><table class="otbl"><thead><tr><th>出發日</th><th>行程</th><th>車輛</th><th class="num">人數</th><th class="num">司機實收</th>
    <th class="num">分攤車資</th><th class="num">分攤餐費</th><th class="num">住宿尾款</th><th class="num">結餘</th><th class="num">累計</th><th>結清</th></tr></thead><tbody>
    ${L.days.map(d=>d.rows.map((r,i)=>`<tr>
        <td>${i?"":fmtDate(d.date)}</td><td>${esc(r.tripName)}</td><td>${carTxt2(r)}</td><td class="num">${r.pax}</td>
        <td class="num">${yuan(r.got)}${r.est?'<div class="meta">預估</div>':""}</td><td class="num">${yuan(r.car)}</td><td class="num">${yuan(r.meal)}</td><td class="num">${yuan(r.lod)}</td>
        <td class="num">${netHtml(r.net,who)}</td><td></td><td></td></tr>`).join("")+`
      <tr style="background:var(--paper)"><td colspan="8"><strong>${fmtDate(d.date)} 小計</strong>${d.rows.length>1?`<span class="meta">（${d.rows.length} 筆）</span>`:""}</td>
        <td class="num">${netHtml(d.net,who)}</td><td class="num">${netHtml(d.cum,who)}</td><td>${markCell(d)}</td></tr>`).join("")}
    </tbody><tfoot><tr><td colspan="3">合計 ${L.days.length} 天・${(lg.rows||[]).length} 筆${L.estN?`（${L.estN} 筆預估）`:""}</td><td class="num">${L.sum("pax")}</td>
      <td class="num">${yuan(L.sum("got"))}</td><td class="num">${yuan(L.sum("car"))}</td><td class="num">${yuan(L.sum("meal"))}</td><td class="num">${yuan(L.sum("lod"))}</td>
      <td class="num">${netHtml(L.total,who)}</td><td colspan="2"></td></tr></tfoot></table></div>`;
}
function ledgerSummary(lg, who){
  const L=ledgerDays(lg);
  return `<dl class="kv"><dt>累計結餘</dt><dd>${netHtml(L.total,who)}</dd><dt>已結清</dt><dd>${netHtml(L.settled,who)}</dd>
    <dt>未結清</dt><dd>${netHtml(L.open,who)}</dd>${L.estN?`<dt></dt><dd class="meta">有 ${L.estN} 筆司機還沒回報，先以預估計算</dd>`:""}</dl>`;
}

/* =====================================================================
   同業損益（只在同業自己的瀏覽器計算，因為團費只有同業看得到）
   營收 = 已出團訂單的團費（手動改過的以手動為準；取消的不算）
   成本 = 分攤車資 + 分攤餐費 + 現場住宿尾款（同業帳）
        + 已預付房費（已售出的房間，算在該訂單）+ 未售出房間的預付房費（算在當天）
        + 其他成本：每人固定金額（如旅平險）、某一天的一筆金額
   毛利 = 營收 − 成本
   activities/{aid}/costs/{cid}   { companyId, items:[{ id, kind:"pax"|"fixed", name, amount, tripId, date }] }  只有該同業讀寫
   activities/{aid}/profit/{cid}  { companyId, pax, revenue, cost, gross, updatedAt }  同業寫入自家合計，管理者只顯示所有同業加總
   ===================================================================== */
function profitCalc(a, lg, items, ctx={ orders:S.orders, rooms:S.rooms, money:S.money }){
  const ORD=ctx.orders||[], ROOMS=ctx.rooms||[], MON=ctx.money||{}, finX=o=>fin(a,o,MON[o.id]||{});
  const today=ymd(new Date()), oById=Object.fromEntries(ORD.map(o=>[o.id,o])), rById=Object.fromEntries(ROOMS.map(r=>[r.id,r]));
  const tName=id=>{ const t=(a.trips||[]).find(t=>t.id===id); return t?tripName(t):""; };
  const paxIt=items.filter(i=>i.kind==="pax"), fixIt=items.filter(i=>i.kind==="fixed");
  const prepaidOf=o=>Object.entries(o.roomUse||{}).reduce((n,[rid,q])=>n+(+rById[rid]?.prepaid||0)*(+q||0),0);
  const paxCostOf=o=>paxIt.filter(i=>!i.tripId||i.tripId===o.tripId).reduce((n,i)=>n+(+i.amount||0)*(+o.pax||0),0);
  const lines=[], seen=new Set(), sellers={}, Z=()=>({ car:0, meal:0, lod:0, pre:0, unsold:0, pax:0, fixed:0 });
  let noFee=0, short=0;
  (lg?.rows||[]).forEach(row=>{
    const c=Z(); let rev=0, pax=0;
    Object.entries(row.ods||{}).forEach(([oid,[got,car,meal,lod]])=>{
      const o=oById[oid]; seen.add(oid);
      c.car+=car; c.meal+=meal; c.lod+=lod;
      if(!o) return;
      const f=finX(o), pre=prepaidOf(o), pc=paxCostOf(o);
      if(f.fee==null) noFee++;
      rev+=f.fee||0; pax+=+o.pax||0; c.pre+=pre; c.pax+=pc;
      if(!row.est && f.balance!=null) short+=Math.max(0, f.balance-got);
      const sk=o.sellerUid||"?", sv=(sellers[sk] ??= { name:o.sellerName||"（未知業務）", pax:0, rev:0, cost:0 });
      sv.pax+=+o.pax||0; sv.rev+=f.fee||0; sv.cost+=car+meal+lod+pre+pc; });
    lines.push({ date:row.date, kind:"tour", trip:row.priv?"自組團":row.tripName, label:`${row.priv?"自組團":(LINES[row.line]||"")+"拼團"}`,
                 pax:pax||row.pax, rev, c, est:row.est });
  });
  // 未售出房間：已出團的日子、或已經過了的日子才算
  const tourDates=new Set((lg?.rows||[]).map(r=>r.date)), usedBy={};
  ORD.filter(o=>o.status!=="cancelled").forEach(o=>Object.entries(o.roomUse||{}).forEach(([rid,q])=>usedBy[rid]=(usedBy[rid]||0)+(+q||0)));
  const uns={};
  ROOMS.forEach(r=>{ if(!(tourDates.has(r.date) || r.date<today)) return;
    const left=Math.max(0,(+r.qty||0)-(usedBy[r.id]||0)), amt=left*(+r.prepaid||0); if(!amt) return;
    const k=r.date+"|"+r.tripId, u=(uns[k] ??= { date:r.date, trip:tName(r.tripId), n:0, amt:0 }); u.n+=left; u.amt+=amt; });
  Object.values(uns).forEach(u=>{ const c=Z(); c.unsold=u.amt; lines.push({ date:u.date, kind:"unsold", trip:u.trip, label:`未售出房間 ${u.n} 間（預付房費）`, pax:0, rev:0, c }); });
  fixIt.forEach(i=>{ const c=Z(); c.fixed=+i.amount||0; lines.push({ date:i.date, kind:"fixed", trip:i.tripId?tName(i.tripId):"共同", label:i.name||"其他成本", pax:0, rev:0, c }); });
  lines.forEach(l=>{ l.cost=Object.values(l.c).reduce((n,x)=>n+x,0); l.gross=l.rev-l.cost; });
  lines.sort((x,y)=>(x.date||"").localeCompare(y.date||"") || ["tour","unsold","fixed"].indexOf(x.kind)-["tour","unsold","fixed"].indexOf(y.kind));
  let cum=0; lines.forEach(l=>{ cum+=l.gross; l.cum=cum; });
  const pend=ORD.filter(o=>o.status!=="cancelled" && !seen.has(o.id));
  const sum=(arr,f)=>arr.reduce((n,x)=>n+f(x),0), cAll=Z();
  lines.forEach(l=>Object.keys(cAll).forEach(k=>cAll[k]+=l.c[k]));
  const byTrip={}; lines.forEach(l=>{ const t=(byTrip[l.trip||"共同"] ??= { trip:l.trip||"共同", pax:0, rev:0, cost:0 }); t.pax+=l.pax; t.rev+=l.rev; t.cost+=l.cost; });
  return { lines, cAll, pax:sum(lines,l=>l.pax), rev:sum(lines,l=>l.rev), cost:sum(lines,l=>l.cost), gross:cum, noFee, short,
    estN:lines.filter(l=>l.est).length, sellers:Object.values(sellers), byTrip:Object.values(byTrip),
    pendPax:sum(pend,o=>+o.pax||0), pendRev:sum(pend,o=>finX(o).fee||0), pendN:pend.length,
    paid:sum(ORD.filter(o=>o.status!=="cancelled"),o=>finX(o).paid||0) };
}

  <header class="pub-hd"><div class="pub-in"><div class="pub-t">${esc(sh.carLabel)}・${fmtDate(sh.date)}</div>
    <div class="pub-s">${esc(sh.activityName)}・${esc(sh.tripName)}・${LINES[sh.line]||""}走${DROUTES[sh.route]||""}${sh.driver?`・司機 ${esc(sh.driver)}`:""}${sh.plate?`・${esc(sh.plate)}`:""}</div></div></header>
  <main class="pub-in pub-main">
    ${locked?`<div class="notice ok">管理者已標記${sh.settle==="remitted"?"已回帳":"已轉帳"}，這張出車單已結清。</div>`:sh.actual?'<div class="notice ok">已回報，可以再修改後重新送出。</div>':""}
    <section class="sec"><h2>客人（依上車順序）・共 ${gs.length} 組 ${pax} 人</h2>
      ${gs.map(g=>`<div class="dg">
        <div class="dg-hd"><span class="dg-t">${esc(g.time||"另約")}</span><strong>${esc(g.pickup)}</strong></div>
        <div><strong>${esc(g.contact)}</strong>・${g.pax} 人・<a href="tel:${esc(g.phone)}">${esc(g.phone)}</a></div>
        ${g.rooms?`<div class="meta">房間：${esc(g.rooms)}</div>`:""}${g.note?`<div class="meta">備註：${esc(g.note)}</div>`:""}
        <div class="dg-money"><span>團費尾款 ${g.balance==null?"請洽業務":yuan(g.balance)}${g.mealDiff?`・餐費補差價 ${yuan(g.mealDiff)}`:""}</span>
          <span>應收 <strong>${g.due==null?"—":yuan(g.due)}</strong></span></div>
        <label class="fld dg-in"><span>實收（元）</span><input type="number" min="0" inputmode="numeric" data-col="${g.oid}" value="${esc(v.collected[g.oid])}" ${dis}></label>
      </div>`).join("")}
    </section>
    <section class="sec"><h2>現場支出</h2>
      ${sh.mealLabel||sh.mealEst?`<label class="fld"><span>餐費（${esc(sh.mealLabel||"現場餐費")}，預估 ${yuan(sh.mealEst)} 元）</span><input type="number" min="0" inputmode="numeric" id="dMeal" value="${esc(v.mealPaid)}" ${dis}></label>`
        :`<label class="fld"><span>現場餐費（沒有就填 0）</span><input type="number" min="0" inputmode="numeric" id="dMeal" value="${esc(v.mealPaid)}" ${dis}></label>`}
      ${(sh.lodging||[]).map(l=>`<label class="fld"><span>住宿尾款：${esc(l.lodge)}（${l.rooms} 間${l.unknown?"，部分金額未填":`，預估 ${yuan(l.amount)} 元`}）</span>
        <input type="number" min="0" inputmode="numeric" data-lod="${esc(l.lodge)}" value="${esc(v.lodging[l.lodge])}" ${dis}></label>`).join("")}
      <label class="fld"><span>備註（選填）</span><input id="dNote" maxlength="200" value="${esc(v.note)}" ${dis}></label>
    </section>
    <section class="sec"><dl class="kv" id="dSum"></dl>
      <div id="dRemit" hidden>
        <div class="notice" style="margin-top:12px"><div><strong>回帳帳號</strong></div>
          <div style="white-space:pre-line;margin-top:4px">${sh.remitBank?esc(sh.remitBank):"還沒有設定回帳帳號，請向調度確認。"}</div>
          ${sh.remitBank?'<button type="button" class="btn sm" id="dBankCp" style="margin-top:8px">複製帳號</button>':""}</div>
        <label class="fld" style="margin-top:10px"><span>轉出帳號後五碼（轉帳後填寫，必填）</span>
          <input id="dLast5" inputmode="numeric" maxlength="5" pattern="[0-9]{5}" placeholder="例如 12345" value="${esc(v.last5)}" ${dis}></label>
      </div>
      <div id="dNoRemit" class="notice ok" style="margin-top:12px" hidden></div>
    </section>
    ${locked?"":'<button class="btn pri w100 big" id="dSend">送出回報</button>'}
  </main>`;
  const remitOf=()=>{ const inc=gs.reduce((n,g)=>n+(+v.collected[g.oid]||0),0), lod=Object.values(v.lodging).reduce((n,x)=>n+(+x||0),0);
    return { inc, lod, r:inc-(+sh.carFee||0)-(+v.mealPaid||0)-lod }; };
  const calc=()=>{ const { inc, lod, r }=remitOf();
    // 要回帳才顯示帳號和後五碼；不用回帳或公司要轉給司機的，只要送出回報
    $("#dRemit").hidden = !(r>0);
    const nr=$("#dNoRemit"); nr.hidden = r>0;
    nr.textContent = r<0 ? "客收不夠付支出，不用回帳。送出回報後，公司會轉帳給你。" : "這趟不用回帳，送出回報即可。";
    $("#dSum").innerHTML=`<dt>客收合計</dt><dd>${yuan(inc)} 元</dd><dt>車資</dt><dd>− ${yuan(sh.carFee)} 元</dd><dt>現場餐費</dt><dd>− ${yuan(+v.mealPaid||0)} 元</dd>
      <dt>住宿尾款</dt><dd>− ${yuan(lod)} 元</dd><dt>${r<0?"不足，公司要轉給你":"應回帳"}</dt><dd><strong style="font-size:20px;color:${r<0?"var(--warn)":"var(--cedar)"}">${yuan(Math.abs(r))} 元</strong></dd>`; };
  calc();
  app.querySelectorAll("[data-col]").forEach(i=>i.oninput=()=>{ v.collected[i.dataset.col]=i.value; calc(); });
  app.querySelectorAll("[data-lod]").forEach(i=>i.oninput=()=>{ v.lodging[i.dataset.lod]=i.value; calc(); });
  $("#dMeal").oninput=e=>{ v.mealPaid=e.target.value; calc(); };
  $("#dNote").oninput=e=>{ v.note=e.target.value; };
  $("#dLast5").oninput=e=>{ e.target.value=e.target.value.replace(/\D/g,"").slice(0,5); v.last5=e.target.value; };
  $("#dBankCp")?.addEventListener("click",()=>navigator.clipboard.writeText(sh.remitBank).then(()=>toast("已複製回帳帳號")));
  $("#dSend")?.addEventListener("click", async()=>{
    const needRemit=remitOf().r>0, last5=String(v.last5||"").trim();
    if(needRemit && !/^\d{5}$/.test(last5)){ toast("請先轉帳回帳，並填入轉出帳號後五碼（5 位數字）"); $("#dLast5").focus(); return; }
    const actual={ last5: needRemit ? last5 : null, collected:Object.fromEntries(gs.map(g=>[g.oid, numOrNull(v.collected[g.oid]) ?? 0])), mealPaid:numOrNull(v.mealPaid) ?? 0,
      lodging:Object.fromEntries(Object.entries(v.lodging).map(([k,x])=>[k, numOrNull(x) ?? 0])), note:String(v.note||"").trim(), at:Date.now() };
    const btn=$("#dSend"); btn.disabled=true;
    try{ await updateDoc(doc(db,"sheets",sh.id), { actual }); sh.actual=actual; toast("已送出回報，謝謝！"); window.scrollTo(0,0); renderDriver(); }
    catch(e){ console.error(e); toast("送出失敗，請稍後再試"); btn.disabled=false; }
  });
}
if(DRIVER_REF) renderDriver();

/* =====================================================================
   常用司機名單（只有管理者）：drivers/{id} { name, phone, plate, carType, defaultFee, note, active }
   派車時每台車可以從名單選司機，或選「手動輸入」臨時填寫。
   車輛上存 driverId（名單司機）或 "manual"，另外存 driver（姓名電話）與 plate（車牌），
   名單之後改了也不會影響已經派好的車。
   ===================================================================== */
const drvLabel = d => [d.name, d.phone].filter(Boolean).join(" ");
async function loadDrivers(){
  const r=await getDocs(collection(db,"drivers"));
  S.drivers=r.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>(+!!y.active)-(+!!x.active) || (x.name||"").localeCompare(y.name||"","zh-Hant"));
}
// 同一位司機在重疊的日子被派到兩台車時提醒（多日遊會佔好幾天）
function driverBusy(a, key, carId, driverId, date, days){
  if(!driverId || driverId==="manual") return [];
  const span=(d,n)=>{ const s=parseYmd(d); return Array.from({length:Math.max(1,n)},(_,i)=>ymd(new Date(s.getFullYear(),s.getMonth(),s.getDate()+i))); };
  const mine=new Set(span(date,days)), hits=[];
  const check=(d,tid,cars,label)=>cars.forEach(c=>{ if(c.driverId!==driverId || (label==="this" && c.id===carId)) return;
    const t=findTrip(a,tid); if(span(d,+t?.days||1).some(x=>mine.has(x))) hits.push(`${fmtDate(d)} ${t?tripName(t):""}`); });
  Object.entries(S.dispatch||{}).forEach(([k,dp])=>{ if(k!==key) check(dp.date,dp.tripId,dp.cars||[],"other"); });
  check(S.plan.d,S.plan.tid,S.plan.cars,"this");
  return [...new Set(hits)];
}
function driverPicker(a, c, days){
  const list=(S.drivers||[]).filter(d=>d.active!==false || d.id===c.driverId);
  const manual = c.driverId==="manual" || (!c.driverId && c.driver);
  const sel = manual ? "manual" : (c.driverId||"");
  const d = !manual && c.driverId ? (S.drivers||[]).find(x=>x.id===c.driverId) : null;
  const busy=driverBusy(a, S.plan.key, c.id, c.driverId, S.plan.d, days);
  return `<div class="drv">
    <select data-drv="${c.id}"><option value="">— 選擇司機 —</option>
      ${list.map(x=>`<option value="${x.id}" ${x.id===sel?"selected":""}>${esc(x.name)}${x.plate?`（${esc(x.plate)}）`:""}${x.carType?`・${esc(x.carType)}`:""}</option>`).join("")}
      <option value="manual" ${sel==="manual"?"selected":""}>✎ 手動輸入</option></select>
    ${manual ? `<input data-cf="${c.id}|driver" placeholder="司機姓名、電話" value="${esc(c.driver||"")}">
      <input data-cf="${c.id}|plate" placeholder="車牌" value="${esc(c.plate||"")}">
      ${c.driver?`<button type="button" class="btn sm ghost" data-drvsave="${c.id}">存為常用司機</button>`:""}`
    : d ? `<span class="meta" style="margin:0">${esc(d.phone||"")}${d.plate?`・${esc(d.plate)}`:""}${d.note?`・${esc(d.note)}`:""}</span>` : ""}
    ${busy.length?`<span class="tag off">這位司機 ${busy.map(esc).join("、")} 也有出車</span>`:""}
  </div>`;
}
function bindDriverPicker(m, a){
  m.querySelectorAll("[data-drv]").forEach(s=>s.onchange=()=>{
    const c=S.plan.cars.find(x=>x.id===s.dataset.drv); if(!c) return;
    if(s.value==="manual"){ c.driverId="manual"; if(c.driver && (S.drivers||[]).some(x=>drvLabel(x)===c.driver)){ c.driver=""; c.plate=""; } }
    else if(!s.value){ c.driverId=null; c.driver=""; c.plate=""; }
    else{ const d=S.drivers.find(x=>x.id===s.value); c.driverId=d.id; c.driver=drvLabel(d); c.plate=d.plate||"";
      if(numOrNull(c.fee)==null && numOrNull(d.defaultFee)!=null) c.fee=+d.defaultFee; }
    planChanged(); });
  m.querySelectorAll("[data-drvsave]").forEach(b=>b.onclick=async()=>{
    const c=S.plan.cars.find(x=>x.id===b.dataset.drvsave), parts=String(c.driver||"").trim().split(/\s+/);
    const phone=parts.find(x=>/\d{6,}/.test(x.replace(/\D/g,"")))||"", name=parts.filter(x=>x!==phone).join(" ")||c.driver;
    try{ const ref=await addDoc(collection(db,"drivers"), { name, phone, plate:c.plate||"", carType:"", defaultFee:null, note:"", active:true, createdAt:serverTimestamp() });
      await loadDrivers(); c.driverId=ref.id; toast(`已把 ${name} 加入常用司機`); planChanged(); }
    catch(e){ toast(authErr(e)); } });
}

/* ---------- 管理者：司機名單 ---------- */
async function renderDrivers(){
  const m=$("#main");
  if(!S.drivers){ m.innerHTML='<div class="loading">讀取司機名單中…</div>'; try{ await loadDrivers(); }catch(e){ m.innerHTML=`<div class="msg">讀取失敗：${esc(authErr(e))}</div>`; return; } }
  m.innerHTML=`
    <div class="bar"><div class="grow"><h1>司機</h1><p class="sub" style="margin:0">固定配合的司機。派車時可以直接選，也可以選「手動輸入」臨時填寫。</p></div>
      <button class="btn pri" id="drvAdd">＋ 新增司機</button></div>
    ${S.drivers.length ? `<div class="scroll"><table class="otbl"><thead><tr><th>姓名</th><th>電話</th><th>車牌</th><th>車型</th><th class="num">預設車資</th><th>備註</th><th>狀態</th><th></th></tr></thead><tbody>
      ${S.drivers.map(d=>`<tr class="${d.active===false?"cancelled":""}"><td><strong>${esc(d.name)}</strong></td><td>${d.phone?`<a href="tel:${esc(d.phone)}">${esc(d.phone)}</a>`:""}</td>
        <td>${esc(d.plate||"")}</td><td>${esc(d.carType||"")}</td><td class="num">${yuan(numOrNull(d.defaultFee))}</td><td class="wrap">${esc(d.note||"")}</td>
        <td>${d.active===false?'<span class="tag off">停用</span>':'<span class="tag open">配合中</span>'}</td>
        <td class="acts"><button class="btn sm" data-drved="${d.id}">修改</button></td></tr>`).join("")}
      </tbody></table></div>` : '<div class="empty">還沒有司機，按「新增司機」建立。</div>'}`;
  $("#drvAdd").onclick=()=>driverDialog();
  m.querySelectorAll("[data-drved]").forEach(b=>b.onclick=()=>driverDialog(S.drivers.find(d=>d.id===b.dataset.drved)));
}
function driverDialog(d){
  const f=(label,name,val,extra="")=>`<label class="fld"><span>${label}</span><input name="${name}" value="${esc(val??"")}" ${extra}></label>`;
  openDialog(`<h2>${d?"修改司機":"新增司機"}</h2>
    ${f("姓名","name",d?.name,"required")}${f("電話","phone",d?.phone,'inputmode="tel"')}
    ${f("車牌","plate",d?.plate)}${f("車型","carType",d?.carType,'placeholder="例如：9 人座"')}
    ${f("預設車資（元，選填）","defaultFee",d?.defaultFee,'type="number" min="0" inputmode="numeric"')}
    <p class="hint" style="font-size:13px;margin:-4px 0 8px">派車選這位司機時，車資還沒填就會自動帶入，之後可以改。</p>
    ${f("備註","note",d?.note)}
    ${d?`<label class="chk"><input type="checkbox" name="active" ${d.active!==false?"checked":""}> 配合中（取消勾選就不會出現在派車選單）</label>`:""}
    ${dlgFt(d?"儲存":"新增")}`, async fd => {
      const data={ name:fd.get("name").trim(), phone:fd.get("phone").trim(), plate:fd.get("plate").trim(), carType:fd.get("carType").trim(),
        defaultFee:numOrNull(fd.get("defaultFee")), note:fd.get("note").trim(), active: d ? fd.get("active")==="on" : true };
      if(!data.name) throw new Error("請填姓名");
      if(d) await setDoc(doc(db,"drivers",d.id), { ...data, createdAt:d.createdAt||serverTimestamp() });
      else await addDoc(collection(db,"drivers"), { ...data, createdAt:serverTimestamp() });
      await loadDrivers(); toast(d?"已儲存":"已新增司機"); renderDrivers();
  });
}

// 業務修改自家公司的客服聯絡資料（同業名稱只有管理者能改）
function coContactDialog(){
  const c=S.company||{};
  openDialog(`<h2>公司客服資料</h2><p class="sub">${esc(c.name||"")}・會顯示在客人報名頁</p>
    <label class="fld"><span>客服電話</span><input name="phone" inputmode="tel" value="${esc(c.phone)}"></label>
    <label class="fld"><span>官方 LINE 帳號（例如 @luguang，或貼上加好友網址）</span><input name="lineOA" autocapitalize="none" spellcheck="false" value="${esc(c.lineOA)}"></label>
    <label class="fld"><span>收款帳號（客人匯訂金用）</span><textarea name="bank" placeholder="銀行、分行、戶名、帳號">${esc(c.bank)}</textarea></label>
    ${dlgFt("儲存")}`, async fd => {
      const v={ phone:fd.get("phone").trim(), lineOA:fd.get("lineOA").trim(), bank:fd.get("bank").trim() };
      const cid=S.me.companyId, b=writeBatch(db);
      b.update(doc(db,"companies",cid), { ...v, updatedAt:serverTimestamp() });
      b.set(doc(db,"pubco",cid), makePubCo({ ...c, ...v }));
      await b.commit(); Object.assign(S.company, v); toast("已儲存，客人報名頁會顯示新的資料"); render();
  });
}
