<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>聯合報名派車系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --cedar:#1E3A2F; --cedar2:#2D5444; --sakura:#C95C78; --sakura-soft:#F9E6EC;
  --paper:#F5F6F3; --card:#FFFFFF; --ink:#1D2621; --stone:#66706A; --line:#DCE1DC;
  --warn:#A8482A; --warn-soft:#FBEDE7; --ok:#2F7A4F; --ok-soft:#E5F2EA;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.6;padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sakura);outline-offset:2px}

/* header */
.top{background:var(--cedar);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 0;border-bottom:4px solid var(--sakura)}
.top-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:1080px;margin:0 auto}
.brand{font-weight:700;font-size:18px;letter-spacing:.02em}
.who{margin-left:auto;font-size:13px;opacity:.85;display:flex;gap:10px;align-items:center}
.who button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:6px;padding:3px 10px;font-size:13px}
.tabs{display:flex;gap:4px;max-width:1080px;margin:12px auto 0;overflow-x:auto}
.tabs button{background:transparent;border:0;color:rgba(255,255,255,.7);padding:10px 14px;border-radius:8px 8px 0 0;white-space:nowrap}
.tabs button.on{background:var(--paper);color:var(--cedar);font-weight:700}

main{max-width:1080px;margin:0 auto;padding:20px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:17px;margin:0 0 12px}
.sub{color:var(--stone);font-size:14px;margin:0 0 18px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.bar .grow{flex:1}

.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 14px}
.btn.pri{background:var(--cedar);border-color:var(--cedar);color:#fff}
.btn.acc{background:var(--sakura);border-color:var(--sakura);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--stone)}
.btn.danger{color:var(--warn);border-color:#E6C3B6}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}

.list{display:grid;gap:12px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.item-hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.item-hd strong{font-size:16px}
.meta{color:var(--stone);font-size:13px;margin-top:4px}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;background:#ECEFEC;color:var(--stone)}
.tag.open{background:var(--ok-soft);color:var(--ok)}
.tag.draft{background:var(--sakura-soft);color:var(--sakura)}
.tag.off{background:var(--warn-soft);color:var(--warn)}

.empty{border:1.5px dashed var(--line);border-radius:12px;padding:32px;text-align:center;color:var(--stone)}

/* editor */
.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
.sec h2{display:flex;align-items:center;gap:8px}
.sec .hint{color:var(--stone);font-size:13px;margin:-6px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--stone)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:#fff;color:var(--ink);font-size:15px;width:100%}
.fld textarea{min-height:70px;resize:vertical}
.chk{display:flex;align-items:center;gap:8px;font-size:14px}
.chk input{width:18px;height:18px;accent-color:var(--cedar)}
.trip{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.trip.off{opacity:.55}
.trip-hd{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-weight:700}

.pk{display:grid;grid-template-columns:2fr 2fr 1fr 1.3fr auto;gap:8px;align-items:end;padding:10px 0;border-top:1px solid var(--line)}
.pk:first-of-type{border-top:0}
.pk .note{grid-column:2 / -2}
@media(max-width:720px){.pk{grid-template-columns:1fr 1fr}.pk .note{grid-column:1 / -1}}

.rt{border-top:1px solid var(--line);padding:12px 0}
.rt:first-of-type{border-top:0}
.rt-hd{display:grid;grid-template-columns:2fr 1fr 1fr 2fr auto;gap:8px;align-items:end}
.rt-prices{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:8px}
@media(max-width:720px){.rt-hd{grid-template-columns:1fr 1fr}}
table.pt{border-collapse:collapse;font-size:14px;margin-top:6px}
table.pt th,table.pt td{border:1px solid var(--line);padding:4px 10px;text-align:right}
table.pt th:first-child,table.pt td:first-child{text-align:left}
/* calendar */
.cal-wrap{display:flex;gap:18px;flex-wrap:wrap}
.cal{min-width:250px}
.cal-title{font-weight:700;margin-bottom:6px}
.cal-g{display:grid;grid-template-columns:repeat(7,34px);gap:4px}
.cal-g .wd{font-size:12px;color:var(--stone);text-align:center}
.day{height:34px;border-radius:6px;border:0;font-size:13px;background:var(--sakura-soft);color:var(--ink)}
.day.out{background:transparent;color:#C3C9C4;cursor:default}
.day.closed{background:repeating-linear-gradient(135deg,#E9ECE9 0 4px,#F6F7F5 4px 8px);color:var(--stone);text-decoration:line-through}
.legend{display:flex;gap:16px;font-size:13px;color:var(--stone);margin-top:10px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px}

.sticky{position:sticky;bottom:0;background:linear-gradient(transparent,var(--paper) 30%);padding:16px 0 calc(env(safe-area-inset-bottom,0px) + 8px);display:flex;gap:10px;justify-content:flex-end}

/* accounts */
.acct{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;flex-wrap:wrap}
.acct .em{color:var(--stone)}
.acct .sp{flex:1}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--cedar)}
.login-card{background:var(--card);border-radius:16px;padding:28px;width:100%;max-width:380px;border-top:6px solid var(--sakura)}
.login-card h1{margin-bottom:2px}
.login-card .fld{margin-bottom:10px}
.or{display:flex;align-items:center;gap:10px;color:var(--stone);font-size:13px;margin:18px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.msg{background:var(--warn-soft);color:var(--warn);padding:10px 12px;border-radius:8px;font-size:14px;margin-bottom:14px}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px}
.w100{width:100%}

/* dialog */
dialog{border:0;border-radius:14px;padding:0;width:min(440px,92vw)}
dialog::backdrop{background:rgba(20,30,25,.45)}
.dlg{padding:22px}
.dlg .fld{margin-bottom:10px}
.dlg-ft{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:99;max-width:90vw}
.loading{padding:60px;text-align:center;color:var(--stone)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin-top:10px}
.kv dt{color:var(--stone)}
.kv dd{margin:0}
.notice{background:var(--sakura-soft);border-radius:10px;padding:12px 14px;font-size:14px;margin-bottom:16px}

/* phase 2：報名月曆、快速報名、訂單 */
.calbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:16px}
.calnav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.calnav strong{font-size:17px;min-width:110px;text-align:center}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--stone);margin-left:auto}
.legend .pl{display:inline-block}
.ocals{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:18px}
.ocal-t{font-weight:700;color:var(--cedar);margin-bottom:6px}
.ocal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.ocal .wd{font-size:12px;color:var(--stone);text-align:center;padding-bottom:2px}
.cd{min-height:58px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:3px 4px;text-align:left;display:flex;flex-direction:column;gap:2px;font:inherit;cursor:pointer;min-width:0}
.cd:hover{border-color:var(--cedar)}
.cd.off{background:transparent;border-style:dashed;opacity:.4;cursor:default}
.cd.pad{visibility:hidden}
.cd.sel{outline:2px solid var(--cedar);outline-offset:-1px}
.cd .dn{font-size:12px;font-weight:700;line-height:1.3}
.pl{font-size:11px;border-radius:4px;padding:0 4px;line-height:1.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl.zero{color:#B5BCB7}
.pl.some{background:#FFF1D6;color:#8A5A00}
.pl.go{background:var(--ok);color:#fff}
.pl.part{background:var(--ok-soft);color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.notice.ok{background:var(--ok-soft);color:var(--ok)}
.linesum{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;margin:4px 0 12px}
.cars{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:12px}
@media(max-width:520px){.cars{grid-template-columns:1fr}}
.car{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.car.pool{border:2px dashed var(--warn);margin-bottom:12px}
.car.over{border-color:var(--warn)}
.car.done{border:2px solid var(--ok);padding:9px 11px}
.car.dropon{outline:3px solid var(--cedar);outline-offset:-1px}
.car-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.car-hd strong{font-size:16px}
.car-f{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.car-f input,.car-f select{border:1px solid var(--line);border-radius:7px;padding:6px 8px;font:inherit;font-size:14px;min-width:0;background:#fff}
.drv{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:-2px 0 8px}
.drv select,.drv input{border:1px solid var(--line);border-radius:7px;padding:6px 8px;font:inherit;font-size:14px;background:#fff;min-width:0}
.drv select{flex:1 1 180px}.drv input{flex:1 1 140px}
.cg{width:100%;border-collapse:collapse;font-size:14px}
.cg td{padding:6px 4px;border-top:1px solid var(--line);vertical-align:top}
.cg tr:first-child td{border-top:0}
.cg td.tm{font-variant-numeric:tabular-nums;color:var(--stone);white-space:nowrap}
.cg td.num{white-space:nowrap;text-align:right}
.cg .tag{margin-left:2px}
.cg tr[draggable]{cursor:grab}
.cg tr.dragging{opacity:.4}
select.mv{border:1px solid var(--line);border-radius:6px;padding:3px 4px;font-size:12px;max-width:120px;background:#fff}
.dropmsg{color:var(--stone);font-size:13px;padding:14px;text-align:center;border:1px dashed var(--line);border-radius:8px}
.tag.web{background:#E6EEF8;color:#2B5C92}
.lkurl{font-size:13px;color:var(--stone);word-break:break-all;margin:4px 0}
.qrbox{margin-top:10px}
.qrbox canvas,.qrbox img{border:8px solid #fff;box-shadow:0 0 0 1px var(--line);border-radius:4px}
.item.off{opacity:.6}
/* 客人報名頁 */
.pub-in{max-width:720px;margin:0 auto;padding:0 16px}
.pub-hd{background:var(--cedar);color:#fff;padding:22px 0 18px}
.pub-t{font-size:22px;font-weight:700;letter-spacing:.02em}
.pub-s{opacity:.85;font-size:14px;margin-top:2px}
.pub-main{padding-top:16px;padding-bottom:28px}
.pub-main .sec h2{display:flex;align-items:center;gap:8px}
.pub-main{counter-reset:sec}
.pub-main .no::before{counter-increment:sec;content:counter(sec)}
.pub-main .no{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--sakura-soft);color:#A33A5B;font-size:13px}
.pub-ft{border-top:1px solid var(--line);padding:16px 0 28px;font-size:14px;color:var(--stone);text-align:center}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.opt{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;cursor:pointer;position:relative}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt.on{border:2px solid var(--cedar);padding:9px 11px;background:var(--ok-soft)}
.opt .meta{margin:0}
.remind{background:var(--sakura-soft);color:#8E3150;border-radius:8px;padding:10px 12px;font-size:14px;margin-top:10px;line-height:1.7}
.pcal .cd{min-height:52px}
.pcal .pl{white-space:normal;font-size:11px;line-height:1.35;padding:1px 3px}
.pcal .pl.go{background:var(--sakura-soft);color:#A33A5B}
.btn.big{padding:14px;font-size:17px;margin-top:6px}
.rmrow{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin-top:6px}
.rmrow select{border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;min-width:0;background:#fff}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:2px 8px;max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.tgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 10px}
.rtbl{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 10px}
.rtbl td,.rtbl th{padding:6px;border-top:1px solid var(--line);text-align:left}
.rtbl th{color:var(--stone);font-weight:500;border-top:0}
.sheetbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:var(--paper);border-radius:8px;padding:6px 8px;margin-bottom:6px;font-size:13px}
.sheetbar>span:first-child{flex:1}
.dg{border-top:1px solid var(--line);padding:12px 0}
.dg:first-of-type{border-top:0}
.dg-hd{display:flex;gap:10px;align-items:baseline;font-size:16px}
.dg-t{font-variant-numeric:tabular-nums;color:var(--cedar);font-weight:700}
.dg-money{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-top:6px;font-size:14px}
.dg-in{max-width:200px;margin-top:6px}
.alert{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.month{font-size:16px;margin:14px 0 2px;color:var(--cedar)}
.dayblk{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.dayhd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.st{width:100%;min-width:300px;border-collapse:collapse;font-size:13px;table-layout:fixed}
.st th{font-weight:500;color:var(--stone);text-align:left;padding:4px 6px;vertical-align:top}
.st td{vertical-align:top;padding:6px;border-top:1px solid var(--line)}
.st tr:first-child th{border-top:0}
.st tbody th{border-top:1px solid var(--line);padding-top:8px;color:var(--ink)}
.st .n{font-size:20px;font-weight:700;line-height:1.2}
.st .n small{font-size:12px;font-weight:400;color:var(--stone)}
.st .s{color:var(--stone);font-size:12px}
.st td.zero .n{color:#C3C9C4}
.st .tag{margin:3px 3px 0 0}
.mini{border:1px solid var(--line);background:#fff;border-radius:6px;padding:1px 7px;font-size:12px;margin:4px 4px 0 0}
.mini.on{background:var(--warn);border-color:var(--warn);color:#fff}
.mini.yes{background:var(--ok);border-color:var(--ok);color:#fff}
.dayorders{margin-top:8px}
.ord{border-top:1px solid var(--line);padding:10px 0}
.ord.cancelled{opacity:.55}
.ord-hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ord .meta{margin-top:2px}
.ord-act{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:13px}
.chips button.on{background:var(--cedar);border-color:var(--cedar);color:#fff}
.search{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;min-width:220px;flex:1;max-width:360px}
textarea.big{width:100%;min-height:150px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:15px;line-height:1.8;font-family:inherit;resize:vertical}
.qopts{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:14px}
.fmt{font-size:14px;margin-bottom:10px}
.fmt summary{cursor:pointer;color:var(--cedar);font-weight:500}
.fmt ul{margin:6px 0;padding-left:20px}
code.ex{display:block;background:var(--paper);border-radius:8px;padding:8px 10px;white-space:pre-wrap;font-size:13px;margin:6px 0;font-family:inherit}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
.pv{width:100%;border-collapse:collapse;font-size:14px}
.pv th{font-weight:500;color:var(--stone);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.pv td{padding:7px 8px;border-top:1px solid var(--line);white-space:nowrap}
.pv td.miss{background:var(--warn-soft);color:var(--warn);font-weight:700}
.pv tr.msgrow td{border-top:0;padding-top:0;white-space:normal;font-size:13px}
.pv .e{color:var(--warn)} .pv .w{color:#8A6A12}
.otbl{width:100%;border-collapse:collapse;font-size:14px}
.otbl th{font-weight:500;color:var(--stone);text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--paper)}
.otbl td{padding:8px;border-top:1px solid var(--line);white-space:nowrap;vertical-align:top}
.otbl td.wrap{white-space:normal;min-width:140px}
.otbl .num{text-align:right}
.otbl td.acts{display:flex;gap:4px}
.otbl tr.cancelled td{opacity:.5}
.otbl tr.cancelled td.acts{opacity:1}
.otbl .meta{margin:2px 0 0;font-size:12px}
.ostat{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:4px 0 6px}
.scard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.scard.all{border:2px solid var(--cedar)}
.scard-t{font-weight:700}
.scard-n{font-size:24px;font-weight:700;line-height:1.3}
.scard-n small{font-size:13px;font-weight:400;color:var(--stone)}
.scard .meta{margin:2px 0 0}
.tsec{margin-top:22px}
.tsec-hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.tsec-hd h2{margin:0}
.otbl tfoot td{font-weight:700;border-top:2px solid var(--line);background:var(--paper)}
.otbl .neg{color:var(--warn)}
.dlgsec{font-weight:700;color:var(--cedar);margin:16px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
.deprow{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin-top:6px}
.deprow input{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;min-width:0}
.itin{display:grid;gap:10px;margin-top:8px}
.itin-day{background:var(--paper);border-radius:8px;padding:8px 12px}
.itin-hd{font-weight:700;color:var(--cedar);margin-bottom:4px}
.itin-ln{display:grid;grid-template-columns:52px 1fr;gap:8px;font-size:14px;line-height:1.7}
.itin-t{color:var(--stone);font-variant-numeric:tabular-nums}
.itin-in{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:14px;line-height:1.7;resize:vertical;background:#fff}
.pvsum{font-size:14px;margin:10px 0 0;color:var(--stone)}
</style>
</head>
<body>
<div id="app"><div class="loading">載入中…</div></div>
<dialog id="dlg"><form class="dlg" id="dlgForm" method="dialog"></form></dialog>

<script type="module">
import { initializeApp, deleteApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

function toast(t){ const d=document.createElement("div"); d.className="toast"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2600); }
function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseYmd(s){ const [y,m,d]=(s||"").split("-").map(Number); return y ? new Date(y,m-1,d) : null; }
function authErr(e){

/* ---------- dialog ---------- */
function openDialog(html, onOk){
  const dlg=$("#dlg"), f=$("#dlgForm");
  f.innerHTML = html;
  f.onsubmit = async ev => {
    if(ev.submitter?.value === "cancel") return;
    ev.preventDefault();
    const btn = f.querySelector('[value="ok"]'); btn.disabled = true;
    try{ const keep = await onOk(new FormData(f)); if(keep !== true) dlg.close(); }
    catch(e){ toast(authErr(e)); }
    finally{ btn.disabled = false; }
  };
  dlg.showModal();
}
const dlgFt = ok => `<div class="dlg-ft"><button class="btn ghost" value="cancel" formnovalidate>取消</button><button class="btn pri" value="ok">${ok}</button></div>`;

onAuthStateChanged(auth, async u => {
  if(PUBLIC_REF || DRIVER_REF) return;   // 客人報名頁、司機出車單不需要登入

async function loadAdmin(){
  const [a,c,u,ad] = await Promise.all([

    getDocs(query(collection(db,"users"), where("role","==","seller"))), getDocs(collection(db,"admins")) ]);
  S.activities = a.docs.map(d=>normActivity({id:d.id,...d.data()})).sort((x,y)=>(y.startDate||"").localeCompare(x.startDate||""));
  S.companies  = c.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>(x.name||"").localeCompare(y.name||"","zh-Hant"));
  S.sellers    = u.docs.map(d=>({id:d.id,...d.data()}));
  S.admins     = ad.docs.map(d=>({id:d.id,...d.data()}));

async function loadSeller(){
  const cid = S.me.companyId;
  const [c,a] = await Promise.all([ getDoc(doc(db,"companies",cid)),
    getDocs(query(collection(db,"activities"), where("companies","array-contains",cid))) ]);
  S.company = c.exists() ? {id:c.id,...c.data()} : null;
  S.activities = a.docs.map(d=>normActivity({id:d.id,...d.data()})).filter(x=>x.status!=="draft")
                  .sort((x,y)=>(y.startDate||"").localeCompare(x.startDate||""));

/* ---------- trips（行程：一日遊、二日遊、三日遊…） ---------- */
const uid = () => "t" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
function cnNum(n){ n=Math.floor(+n)||0; const d="零一二三四五六七八九";
  if(n<10) return d[n]; if(n<20) return "十"+(n%10?d[n%10]:""); if(n<100) return d[Math.floor(n/10)]+"十"+(n%10?d[n%10]:""); return String(n); }
const autoLabel = days => cnNum(days) + "日遊";
const tripName = t => (t.label||"").trim() || autoLabel(t.days);
function mkTrip(days, extra={}){
  return { id:uid(), enabled:true, days, label:"", pricing: days>1 ? "room" : "person",
    pickupTime:"07:00", price:null, deposit:null, carPrice:null, carDeposit:null, roomTypes:[], ...extra };
}
// 舊版資料（trips.day / trips.two + 最外層 roomTypes）轉成新版的行程陣列
function normActivity(a){
  if(Array.isArray(a.trips)) return a;
  const o=a.trips||{}, out=[];
  const base = t => ({ enabled:!!t.enabled, pickupTime:t.pickupTime||"07:00", price:t.price??null, deposit:t.deposit??null,
                       carPrice:t.carPrice??null, carDeposit:t.carDeposit??null });
  if(o.day) out.push({ id:"day", days:1, label:"", pricing:"person", ...base(o.day), roomTypes:[] });
  if(o.two) out.push({ id:"two", days:2, label:"", pricing:"room", ...base(o.two), roomTypes:a.roomTypes||[] });
  const { roomTypes, ...rest } = a;
  return { ...rest, trips:out };
}

function newActivity(){
  return { name:"", status:"draft", startDate:"", endDate:"", closedDates:[],
    trips:[ mkTrip(1,{ pickupTime:"06:00" }), mkTrip(2,{ pickupTime:"07:00" }) ],
    seatsPerCar:8, threshold:{ taipei:6, taichung:6 },
    dayMealTablePrice:3500, twoMealAllowance:350, mealCutoffDays:7,
    holdHours:120, holdShortDays:5, holdUntilDaysBefore:2, remitBank:"",
    pickups:[
      { name:"台北車站西三門", aliases:"北車,西三門", line:"taipei", route:"either", offset:0, public:true, note:"彈性起點：國一車有空位時先補國一車，其餘走國三" },
      { name:"台中朝馬秋紅谷7-11", aliases:"秋紅谷,朝馬", line:"taichung", route:"n1", offset:0, public:true, note:"" } ],
    companies:[] };
}
function sakuraTemplate(){ const a=newActivity(); a.name="2027 司馬庫斯櫻花季"; a.startDate="2027-02-13"; a.endDate="2027-03-10";
  a.trips[1].roomTypes = ["恩典","恩典景觀","喜樂","喜樂小型"].map(name=>({ name, minPax:2, maxPax:4, prices:{}, note:"" }));
  return a; }
const roomPrice = rt => { const v=Object.entries(rt.prices||{}).filter(([n,p])=>p && +n>=rt.minPax && +n<=rt.maxPax).map(([,p])=>+p); return v.length ? v : null; };

};

};
const chk = (label, path, extra="") => `<label class="chk"><input type="checkbox" data-path="${path}" ${getp(S.draft,path)?"checked":""} ${extra}> ${label}</label>`;

function renderCal(){
  const d=S.draft, box=$("#cal"); if(!box) return;
  const s=parseYmd(d.startDate), e=parseYmd(d.endDate);
  if(!s || !e || s>e){ box.innerHTML='<p class="hint" style="margin:0">先在「基本資料」填好出團日期範圍。</p>'; return; }
  const closed = new Set(d.closedDates);
  let html='<div class="cal-wrap">';
  for(let m=new Date(s.getFullYear(),s.getMonth(),1); m<=e; m=new Date(m.getFullYear(),m.getMonth()+1,1)){
    html += `<div class="cal"><div class="cal-title">${m.getFullYear()} 年 ${m.getMonth()+1} 月</div><div class="cal-g">`
         + "日一二三四五六".split("").map(w=>`<div class="wd">${w}</div>`).join("")
         + "<div></div>".repeat(m.getDay());
    const last=new Date(m.getFullYear(),m.getMonth()+1,0).getDate();
    for(let day=1; day<=last; day++){
      const dt=new Date(m.getFullYear(),m.getMonth(),day), k=ymd(dt), inR = dt>=s && dt<=e;
      html += inR ? `<button type="button" class="day ${closed.has(k)?"closed":""}" data-day="${k}" aria-pressed="${closed.has(k)}" aria-label="${k}${closed.has(k)?" 不出團":""}">${day}</button>`
                  : `<span class="day out" style="display:grid;place-items:center">${day}</span>`;
    }
    html += "</div></div>";
  }
  const open = Math.round((e-s)/864e5)+1 - [...closed].filter(k=>{const t=parseYmd(k);return t>=s&&t<=e;}).length;
  html += `</div><div class="legend"><span><i style="background:var(--sakura-soft)"></i>出團 ${open} 天</span><span><i style="background:repeating-linear-gradient(135deg,#E2E6E2 0 3px,#F6F7F5 3px 6px)"></i>不出團</span></div>`;
  box.innerHTML = html;
  box.querySelectorAll("[data-day]").forEach(b => b.onclick = () => {
    const k=b.dataset.day; d.closedDates = closed.has(k) ? d.closedDates.filter(x=>x!==k) : [...d.closedDates,k].sort(); renderCal(); });
}

async function saveActivity(){
  const d = S.draft;
  const errs = [];
  if(!d.name?.trim()) errs.push("活動名稱");
  if(!d.startDate || !d.endDate || d.startDate > d.endDate) errs.push("出團日期範圍");
  d.trips.forEach(t=>{
    t.days = Math.round(+t.days);
    t.label = (t.label||"").trim();
    t.itinerary = Array.from({length:(t.days>=1 && t.days<=30) ? t.days : 0}, (_,k)=>String(t.itinerary?.[k] ?? "").replace(/\s+$/,""));
    t.roomTypes = (t.roomTypes||[]).filter(r=>r.name?.trim()).map(r=>{
      const minPax=+r.minPax||1, maxPax=Math.max(+r.maxPax||1, minPax), prices={};
      Object.entries(r.prices||{}).forEach(([n,p])=>{ if(p!=null && p!=="" && +n>=minPax && +n<=maxPax) prices[n]=+p; });
      return {...r, name:r.name.trim(), minPax, maxPax, prices}; });
  });
  if(d.trips.some(t=>!(t.days>=1 && t.days<=30))) errs.push("行程天數（1～30 天）");
  if(!d.trips.some(t=>t.enabled)) errs.push("至少勾選一種行程");
  const names = d.trips.map(tripName);
  if(new Set(names).size !== names.length) errs.push("行程名稱不能重複（同天數請填顯示名稱區分）");
  d.trips.sort((a,b)=>a.days-b.days);
  d.pickups = d.pickups.filter(p=>p.name?.trim());
  if(!d.pickups.length) errs.push("至少一個上車點");
  if(d.status==="open"){
    d.trips.filter(t=>t.enabled).forEach(t=>{
      if(t.pricing==="room"){ if(!t.roomTypes.some(r=>roomPrice(r))) errs.push(tripName(t)+"房型價格"); }
      else if(!t.price) errs.push(tripName(t)+"售價");
    });
    if(!d.companies.length) errs.push("參與同業");
  }
  if(errs.length){ toast("請補上：" + errs.join("、")); return; }
  const { id, ...data } = d;
  data.closedDates = data.closedDates.filter(k => k>=data.startDate && k<=data.endDate);
  data.updatedAt = serverTimestamp();
  const btn=$("#save"); btn.disabled=true;
  try{
    if(id) await setDoc(doc(db,"activities",id), data);
    else { data.createdAt = serverTimestamp(); await addDoc(collection(db,"activities"), data); }
    toast("已儲存活動"); S.draft=null; await loadAdmin(); render();
  }catch(e){ toast(authErr(e)); btn.disabled=false; }
}
async function deleteActivity(){
  try{
    const has = await getDocs(query(collection(db,"activities",S.draft.id,"orders"), limit(1)));
    if(!has.empty){ toast("這個活動已經有報名資料，不能刪除。可以把狀態改成「已結束」。"); return; }
  }catch(e){ toast(authErr(e)); return; }
  if(!confirm(`確定刪除「${S.draft.name}」？刪除後無法復原。`)) return;
  try{ await deleteDoc(doc(db,"activities",S.draft.id)); await deleteDoc(doc(db,"pub",S.draft.id)).catch(()=>{}); toast("已刪除活動"); S.draft=null; await loadAdmin(); render(); }
  catch(e){ toast(authErr(e)); }
}

/* =====================================================================
   第二階段：報名月曆、快速報名、訂單
   資料位置：
     activities/{aid}/orders/{oid}  完整訂單（只有自家同業和管理者讀得到）
     activities/{aid}/slots/{oid}   同一張訂單的人數摘要，沒有姓名、電話、同業，
                                    給所有參與同業算月曆加總用
   ===================================================================== */
const OSTAT = { pending:"保留中", confirmed:"已確認", cancelled:"已取消", expired:"保留逾期" };
const OSTAT_CLS = { pending:"draft", confirmed:"open", cancelled:"", expired:"off" };
const effStatus = o => (o.status==="pending" && !(o.holdUntil > Date.now())) ? "expired" : o.status;
const curAct = () => S.activities.find(a=>a.id===S.actId);
const findTrip = (a,id) => (a.trips||[]).find(t=>t.id===id);
const flagOf = (a,d,tid,l) => a.flags?.[d]?.[tid]?.[l] || {};
const createdMs = o => o.createdAt?.seconds ? o.createdAt.seconds*1000 : 0;
function fmtDate(s){ const d=parseYmd(s); return d ? `${d.getMonth()+1}/${d.getDate()}（${"日一二三四五六"[d.getDay()]}）` : (s||""); }
function fmtTime(ms){ const d=new Date(ms); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }
function openDates(a){
  const s=parseYmd(a.startDate), e=parseYmd(a.endDate), out=[]; if(!s || !e) return out;
  const closed=new Set(a.closedDates||[]);
  for(let d=new Date(s); d<=e; d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1)){ const k=ymd(d); if(!closed.has(k)) out.push(k); }
  return out;
}
// 保留期限：一般保留 holdHours 小時，但不超過「出發前 N 天」當天結束；出發前幾天內報名就直接保留到那天
function holdUntilFor(a, date){
  const now=Date.now(), dep=parseYmd(date);
  const deadline = new Date(dep.getFullYear(), dep.getMonth(), dep.getDate() - (+a.holdUntilDaysBefore||0), 23, 59, 59).getTime();
  const today = new Date(); today.setHours(0,0,0,0);
  const daysLeft = Math.round((dep - today)/864e5);
  let until = daysLeft < (+a.holdShortDays||0) ? deadline : Math.min(now + (+a.holdHours||120)*3600e3, deadline);
  if(until <= now){ const e=new Date(); e.setHours(23,59,59,0); until=e.getTime(); }
  return until;
}
const slotOf = o => ({ date:o.date, tripId:o.tripId, line:o.line, pax:+o.pax, privateCar:!!o.privateCar,
                       status:o.status, holdUntil:o.holdUntil ?? null, roomUse:o.roomUse || {} });

// 某天、某行程、某路線的人數統計（自組團另外算，不計入成團）
function slotStats(a, entries, d, tid, line){
  const seats=+a.seatsPerCar||8; let conf=0, held=0, priv=0, privCars=0;
  for(const e of entries){
    if(e.date!==d || e.tripId!==tid || e.line!==line) continue;
    const st=effStatus(e); if(st!=="confirmed" && st!=="pending") continue;
    if(e.privateCar){ priv++; privCars+=Math.ceil((+e.pax||0)/seats); continue; }
    if(st==="confirmed") conf+=+e.pax||0; else held+=+e.pax||0;
  }
  // 沒有額滿：超過一車就加開下一車，每台車都要達到成團人數才出發。
  // 已確認人數平均分到 k 台車（k = 已確認人數 ÷ 每車座位，無條件進位），
  // 已確認人數 ≥ k × 成團人數，k 台車就都成團；不夠的話前 k−1 台成團，第 k 台還差幾人。
  const f=flagOf(a,d,tid,line), thr=Math.min(+a.threshold?.[line]||0, seats), total=conf+held;
  const cars=Math.ceil(total/seats), k=Math.ceil(conf/seats);
  let goCars, short;
  if(f.go==="yes"){ goCars=Math.max(1,cars,k); short=0; }
  else if(f.go==="no"){ goCars=0; short=0; }
  else if(conf===0){ goCars=0; short=thr; }
  else if(conf>=k*thr){ goCars=k; short=0; }
  else { goCars=k-1; short=k*thr-conf; }
  return { conf, held, total, priv, privCars, cars, free: cars*seats-total, goFlag:f.go||null,
           goCars, short, go: goCars>0, allGo: goCars>0 && short===0 };
}

/* ---------- 費用、訂金、尾款 ----------
   存在 activities/{aid}/money/{oid}，該同業讀寫；系統擁有者唯讀（同業帳務），其他管理者看不到團費、訂金與優惠。
   訂單本身只多存一個「尾款」數字，之後派車、司機收款會用到。 */
const numOrNull = v => (v===null || v===undefined || v==="") ? null : +v;
const yuan = n => n==null ? "—" : Number(n).toLocaleString("zh-TW");
function autoFee(a,o){
  const t=findTrip(a,o.tripId); if(!t) return null;
  const rf = isRoomTrip(t) ? roomFee(t,o.rooms) : 0;      // 依房型計價：每間房依房型和入住人數加總
  if(o.privateCar){ const c=numOrNull(t.carPrice); return c==null || rf==null ? null : c+rf; }
  if(isRoomTrip(t)) return rf;
  const p=numOrNull(t.price); return p==null ? null : p*(+o.pax||0);
}
function depositDue(a,o){
  const t=findTrip(a,o.tripId); if(!t) return null;
  if(o.privateCar) return numOrNull(t.carDeposit);
  const d=numOrNull(t.deposit); return d==null ? null : d*(+o.pax||0);
}
function fin(a,o,m){
  m = m || S.money?.[o.id] || {};
  const manual=numOrNull(m.fee)!=null, auto=autoFee(a,o), fee=manual ? +m.fee : auto;
  const deps=m.deposits||[], paid=deps.reduce((n,d)=>n+(+d.amount||0),0);
  return { fee, auto, manual, feeNote:m.feeNote||"", deps, paid,
           last5:deps.map(d=>d.last5).filter(Boolean).join("、"),
           due:depositDue(a,o), balance: fee==null ? null : fee-paid };
}

// 一次寫入訂單、人數摘要；同業另外寫入費用資料，並把算好的尾款存在訂單上
async function saveOrder(o, changes, m){
  const a=curAct(); const { id, ...rest } = o;
  const data={ ...rest, ...changes, updatedAt:serverTimestamp() };
  data.rooms=data.rooms||[]; data.roomUse=data.roomUse||{};
  const b=writeBatch(db);
  if(S.role!=="admin"){
    const mm={ fee:null, feeNote:"", deposits:[], ...(S.money?.[id]||{}), ...(m||{}) };
    data.balance=fin(a,data,mm).balance;
    b.set(doc(db,"activities",a.id,"money",id), { companyId:data.companyId, fee:numOrNull(mm.fee), feeNote:mm.feeNote||"",
      deposits:mm.deposits||[], updatedAt:serverTimestamp() });
  }
  b.set(doc(db,"activities",a.id,"orders",id), data);
  b.set(doc(db,"activities",a.id,"slots",id), slotOf(data));
  await b.commit();
}

// 上方月曆：每個行程一個月曆，各格顯示台北線、台中線人數；點日期跳到下方那天
function boardCal(a,trips,lines){
  const s=parseYmd(a.startDate), e=parseYmd(a.endDate); if(!s || !e) return "";
  const months=[]; for(let d=new Date(s.getFullYear(),s.getMonth(),1); d<=e; d=new Date(d.getFullYear(),d.getMonth()+1,1)) months.push(ymd(d).slice(0,7));
  if(!months.includes(S.calMonth)) S.calMonth = months.includes((S.openDay||"").slice(0,7)) ? S.openDay.slice(0,7) : months[0];
  const i=months.indexOf(S.calMonth), [y,mo]=S.calMonth.split("-").map(Number);
  const pad=new Date(y,mo-1,1).getDay(), n=new Date(y,mo,0).getDate(), open=new Set(openDates(a));
  const short=l=>LINES[l].replace("線","").slice(-1);
  const cal=t=>{
    let h='<div class="ocal">'+"日一二三四五六".split("").map(w=>`<div class="wd">${w}</div>`).join("");
    for(let k=0;k<pad;k++) h+='<div class="cd pad"></div>';
    for(let dd=1; dd<=n; dd++){
      const k=ymd(new Date(y,mo-1,dd));
      if(!open.has(k)){ h+=`<div class="cd off"><span class="dn">${dd}</span></div>`; continue; }
      const pills=lines.map(l=>{ const x=slotStats(a,S.slots,k,t.id,l);
        const cls=x.allGo?"go":x.go?"part":(x.total||x.priv)?"some":"zero";
        return `<span class="pl ${cls}">${short(l)} ${x.total}${x.priv?`+包${x.privCars}`:""}${x.allGo?" ✓":x.go?` ✓${x.goCars}`:""}</span>`; }).join("");
      h+=`<button type="button" class="cd ${S.openDay===k?"sel":""}" data-cday="${k}" title="${fmtDate(k)} ${esc(tripName(t))}"><span class="dn">${dd}</span>${pills}</button>`;
    }
    return h+'</div>';
  };
  return `<div class="calbox">
    <div class="calnav">
      <button class="btn sm" ${i>0?`data-mnav="${months[i-1]}"`:"disabled"}>‹ 上個月</button>
      <strong>${y} 年 ${mo} 月</strong>

    </div>
    <div class="ocals">${trips.map(t=>`<div><div class="ocal-t">${esc(tripName(t))}</div>${cal(t)}</div>`).join("")}</div>
  </div>`;
}

function statCell(a,d,t,l){
  const s=slotStats(a,S.slots,d,t.id,l), key=`${d}|${t.id}|${l}`, empty=!s.total && !s.priv;
  let h = `<div class="n">${s.total}<small> 人</small></div>`;
  if(s.held) h += `<div class="s">確認 ${s.conf}・保留 ${s.held}</div>`;
  if(s.goFlag==="yes") h += `<span class="tag open">成團（手動）</span>`;
  else if(s.goFlag==="no") h += `<span class="tag off">不成團</span>`;
  else if(s.allGo) h += `<span class="tag open">${s.goCars>1?s.goCars+" 車":""}成團</span>`;
  else if(s.go) h += `<span class="tag open">${s.goCars} 車成團</span><span class="tag">第 ${s.goCars+1} 車差 ${s.short} 人</span>`;
  else if(s.total) h += `<span class="tag">差 ${s.short} 人</span>`;
  if(s.total) h += `<div class="s">${s.cars} 車・空 ${s.free} 位</div>`;
  if(s.priv) h += `<div class="s">自組團 ${s.priv} 組（${s.privCars} 車）</div>`;
  if(S.role==="admin") h += `<div><button class="mini ${
      s.goFlag==="yes"?"yes":s.goFlag==="no"?"on":""}" data-go="${key}">${s.goFlag==="yes"?"手動成團":s.goFlag==="no"?"手動不成團":"成團：自動"}</button></div>`;
  return `<td class="${empty?"zero":""}">${h}</td>`;
}

function bindOrderActions(root){
  root.querySelectorAll("[data-oconf]").forEach(b=>b.onclick=()=>orderAction(b.dataset.oconf,"confirm"));

  root.querySelectorAll("[data-orestore]").forEach(b=>b.onclick=()=>orderAction(b.dataset.orestore,"restore"));
  root.querySelectorAll("[data-oedit]").forEach(b=>b.onclick=()=>orderDialog(S.orders.find(o=>o.id===b.dataset.oedit)));

async function orderAction(id, act){
  const a=curAct(), o=S.orders.find(x=>x.id===id); if(!o) return;
  let ch;
  if(act==="confirm"){
    if(S.role!=="admin") return payDialog(o);
    ch={ status:"confirmed", holdUntil:null };
  }else if(act==="cancel"){
    if(!confirm(`取消 ${o.contact}（${fmtDate(o.date)}，${o.pax} 人）的報名？`)) return;
    ch={ status:"cancelled", holdUntil:null, carNo:null };
  }else{
    if(!openDates(a).includes(o.date)){ toast("這天已經不出團，請先修改日期"); return; }
    ch={ status:"pending", holdUntil:holdUntilFor(a,o.date) };
  }
  try{ await saveOrder(o,ch); toast(act==="confirm"?"已確認收款":act==="cancel"?"已取消報名":"已恢復，先保留座位"); await reloadAct(); render(); }
  catch(e){ toast(authErr(e)); }
}

  openDialog(`<h2>確認收款</h2>

const PAX_W="大人|大|成人|小孩|小朋友|兒童|小|嬰兒|嬰|幼兒";
function cnToNum(s){
  if(/^\d+$/.test(s)) return +s;
  const d={零:0,一:1,二:2,兩:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9};
  const m=s.match(/^([一二兩三四五六七八九])?十([一二三四五六七八九])?$/);
  if(m) return (m[1]?d[m[1]]:1)*10 + (m[2]?d[m[2]]:0);
  return s.length===1 && s in d ? d[s] : NaN;
}
function parsePax(tok){
  let m=tok.match(/^(?:共|總共)?(\d{1,2})(?:人|位|名)?$/); if(m) return { total:+m[1] };
  if(new RegExp(`^(?:(?:${PAX_W})\\d{1,2}|\\d{1,2}(?:${PAX_W}))+$`).test(tok)) return { part:[...tok.matchAll(/\d{1,2}/g)].reduce((n,x)=>n+ +x[0],0) };
  return null;
}
function matchPickup(tok, pk){
  let best=null, bs=0;
  for(const {p,keys} of pk) for(const k of keys){
    let sc=0;
    if(k===tok) sc=1000+k.length;
    else if(k.length>=2 && tok.includes(k)) sc=500+k.length;
    else if(tok.length>=2 && k.includes(tok)) sc=100+tok.length;
    if(sc>bs){ bs=sc; best=p; }
  }
  return best;
}
function resolveDate(a, y, mo, d){
  const s=parseYmd(a.startDate), e=parseYmd(a.endDate);
  const ys = y ? [+y] : [...new Set([s?.getFullYear(), e?.getFullYear()].filter(Boolean))];
  if(!ys.length) ys.push(new Date().getFullYear());
  for(const yy of ys){ const dt=new Date(yy,mo-1,d); if(dt.getMonth()===mo-1 && s && e && dt>=s && dt<=e) return ymd(dt); }
  const dt=new Date(ys[0],mo-1,d); return dt.getMonth()===mo-1 ? ymd(dt) : "invalid";
}
function parseQuick(text, a){
  const pk=(a.pickups||[]).map(p=>({ p, keys:[p.name, ...String(p.aliases||"").split(/[,，、\s]+/)].map(k=>k.trim()).filter(Boolean) }));
  const trips=(a.trips||[]).filter(t=>t.enabled), seen=new Set(), batchUsed={};
  const rnames=[...new Set(trips.flatMap(t=>(t.roomTypes||[]).map(x=>x.name)))].sort((x,y)=>y.length-x.length);
  return text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).slice(0,200).map(raw=>{
    const r={ raw, errs:[], warns:[], left:[] };
    let txt=raw;
    const nm=txt.match(/備註\s*[:：]?\s*/); if(nm){ r.note=txt.slice(nm.index+nm[0].length).trim(); txt=txt.slice(0,nm.index); }
    txt=txt.replace(/line\s*(?:id)?\s*[:：=]\s*(\S+)/i,(_,v)=>{ r.lineId=v; return " "; });
    txt=txt.replace(/(^|\D)(09\d{2}[-\s]?\d{3}[-\s]?\d{3})(?!\d)/,(_,pre,ph)=>{ r.phone=ph.replace(/\D/g,""); return pre+" "; });
    txt=txt.replace(/(?:帳號)?(?:後|末)\s*(?:五|5)\s*碼\s*[:：]?\s*(\d{5})(?!\d)/,(_,v)=>{ r.last5=v; return " "; });
    txt=txt.replace(/訂金\s*[:：]?\s*(\d[\d,]*)\s*元?/,(_,v)=>{ r.depAmt=+v.replace(/,/g,""); return " "; });
    let paxTotal=null, paxPart=null, days=null, trip=null, m;
    for(const tok0 of txt.split(/[\s,，、;；]+/).filter(Boolean)){
      const tok=tok0.replace(/[（(][^）)]*[）)]$/,"");
      if(!r.last5 && /^\d{5}$/.test(tok)){ r.last5=tok; continue; }
      if(!r.date && (m=tok.match(/^(?:(\d{4})[\/.\-年])?(\d{1,2})[\/.\-月](\d{1,2})日?$/))){ r.date=resolveDate(a,m[1],+m[2],+m[3]); continue; }
      if(/^(自組團?|包車)$/.test(tok)){ r.privateCar=true; continue; }
      if((m=tok.match(/^([一二兩三四五六七八九十\d]+)日遊?$/)) && cnToNum(m[1])>0){ days=cnToNum(m[1]); continue; }
      const lbl=trips.find(t=>tripName(t)===tok); if(lbl){ trip=lbl; continue; }
      const px=parsePax(tok);
      if(px && px.total!=null && paxTotal==null && paxPart==null){ paxTotal=px.total; continue; }
      if(px && px.part!=null && paxTotal==null){ paxPart=(paxPart||0)+px.part; continue; }
      const rmt=matchRoomTok(tok,rnames); if(rmt){ (r.roomToks ??= []).push(rmt); continue; }
      if(!r.pickupObj){ const p=matchPickup(tok,pk); if(p){ r.pickupObj=p; continue; } }
      r.left.push(tok0);
    }
    r.pax = paxTotal ?? paxPart;
    if(!trip){
      if(days!=null){
        const c=trips.filter(t=>+t.days===days);
        if(c.length===1) trip=c[0];
        else if(c.length>1) r.errs.push(`有好幾個${autoLabel(days)}，請直接寫行程名稱：${c.map(tripName).join("、")}`);
        else r.errs.push(`這個活動沒有開放${autoLabel(days)}`);
      }else{
        const one=trips.filter(t=>+t.days===1);
        if(one.length===1) trip=one[0]; else if(trips.length===1) trip=trips[0];
        else r.errs.push("請寫是幾日遊（例如「二日」）");
      }
    }
    r.trip=trip;
    if(trip && r.pax!=null) r.due=depositDue(a,{ tripId:trip.id, pax:r.pax, privateCar:r.privateCar });
    r.contact=r.left[0]||"";
    if(r.left.length>1) r.note=[r.left.slice(1).join(" "), r.note].filter(Boolean).join("；");
    if(!r.date) r.errs.push("缺日期");
    else if(r.date==="invalid") r.errs.push("日期不正確");
    else if(r.date<a.startDate || r.date>a.endDate) r.errs.push("日期不在出團期間");
    else if((a.closedDates||[]).includes(r.date)) r.errs.push("這天不出團");
    if(r.pax==null) r.errs.push("缺人數");
    else if(r.pax<1 || r.pax>99) r.errs.push("人數不正確");
    else if(r.privateCar && r.pax>(+a.seatsPerCar||8)) r.errs.push(`自組團一台車最多 ${a.seatsPerCar} 人`);
    if(!r.pickupObj) r.errs.push("找不到上車點");
    if(!r.contact) r.errs.push("缺聯絡人");
    if(!r.phone) r.errs.push("缺電話（09 開頭 10 碼）");
    if(!r.pickupObj && r.left.length>1) r.errs.push(`看不懂的字：${r.left.join("、")}（上車點可以請管理者加別名）`);
    if(trip && isRoomTrip(trip) && r.date && r.pax!=null && !r.errs.length){
      const av=roomAvail(myRoomItems(), S.slots, trip.id, r.date, null, batchUsed), left=Object.values(av).reduce((n,x)=>n+x.left,0);
      if(r.roomToks?.length){
        const blank=r.roomToks.filter(x=>x.occ==null);
        if(blank.length && r.roomToks.length===1) r.roomToks[0].occ=r.pax;
        if(r.roomToks.some(x=>x.occ==null)) r.errs.push("好幾間房時，請寫每間住幾人，例如「恩典3 喜樂2」");
        else{
          const e=checkRooms(trip, r.roomToks, r.pax);
          if(e) r.errs.push(e);
          else{ const use=allocRooms(r.roomToks, av);
            if(!use) r.errs.push(`${fmtDate(r.date)}的房間不夠：${Object.entries(av).map(([k,x])=>`${k} 剩 ${x.left} 間`).join("、") || "這天沒有登記房間"}`);
            else{ r.rooms=r.roomToks; r.roomUse=use; Object.entries(use).forEach(([k,n])=>batchUsed[k]=(batchUsed[k]||0)+n); } }
        }
      }else if(!left) r.errs.push(`${fmtDate(r.date)}${tripName(trip)}自家的房間已經用完（或還沒登記）`);
      else r.warns.push(`還沒寫房型，送出後請到「我的訂單」補上（這天還有 ${Object.entries(av).map(([k,x])=>`${k} ${x.left} 間`).join("、")}）`);
    }else if(trip && !isRoomTrip(trip) && r.roomToks?.length) r.errs.push(`${tripName(trip)}不用選房`);
    if(r.phone && r.date){
      const k=r.phone+"|"+r.date;
      if(seen.has(k)) r.warns.push("這批裡面有同一天、同電話的另一行");
      else if(S.orders.some(o=>o.status!=="cancelled" && o.phone===r.phone && o.date===r.date)) r.warns.push("這天已經有同電話的訂單，請確認不是重複報名");
      seen.add(k);
    }
    return r;
  });
}

        `<td>${r.last5 ? `後五碼 ${esc(r.last5)}・${yuan(r.depAmt ?? r.due)}` : r.depAmt!=null ? `${yuan(r.depAmt)}（未填後五碼）` : '<span class="meta">保留座位</span>'}</td>`,
        `<td>${[r.privateCar?"自組團":"", r.rooms?"房："+esc(roomsTxt(r.rooms)):"", r.lineId?"LINE "+esc(r.lineId):"", r.note?"備註："+esc(r.note):""].filter(Boolean).join("・")}</td>`].join("")}</tr>
        ${r.errs.length||r.warns.length?`<tr class="msgrow"><td></td><td colspan="8">${r.errs.map(e=>`<div class="e">✕ ${esc(e)}</div>`).join("")}${r.warns.map(w=>`<div class="w">！${esc(w)}</div>`).join("")}</td></tr>`:""}`).join("")}
      </table></div>
      <p class="pvsum">共 ${rows.length} 組、${rows.reduce((n,r)=>n+(+r.pax||0),0)} 人${bad?`，<b style="color:var(--warn)">${bad} 行需要修正</b>`:"，可以送出"}</p>` : "";
    $("#qsend").disabled = !rows.length || bad>0;
    $("#qsend").textContent = rows.length ? `送出 ${rows.length} 組` : "送出";
  };
  ta.oninput=update; update();
  m.querySelectorAll('[name="qst"]').forEach(x=>x.onchange=()=>{ S.qst=x.value; });
  $("#qclear").onclick=()=>{ if(ta.value && !confirm("清空輸入的內容？")) return; ta.value=""; update(); ta.focus(); };
  $("#qsend").onclick=async()=>{
    const rows=parseQuick(ta.value,a); if(!rows.length || rows.some(r=>r.errs.length)) return;
    if(a.status!=="open"){ toast("這個活動目前沒有開放報名"); return; }
    const btn=$("#qsend"); btn.disabled=true;
    // 規則每次寫入能查的文件數有限，所以每 5 組送一次；中途失敗時，沒送出的行會留在輸入框
    let sent=0;
    try{
      for(let i=0; i<rows.length; i+=5){
        const b=writeBatch(db);
        rows.slice(i,i+5).forEach(r=>{
          const ref=doc(collection(db,"activities",a.id,"orders")), p=r.pickupObj;
          const data={ activityId:a.id, companyId:S.me.companyId, sellerUid:S.user.uid, sellerName:S.me.name||"",
            date:r.date, tripId:r.trip.id, pax:r.pax, privateCar:!!r.privateCar, pickup:p.name, line:p.line, route:p.route||"",
            contact:r.contact, phone:r.phone, lineId:r.lineId||"", note:r.note||"", raw:r.raw, source:"quick",
            rooms:r.rooms||[], roomUse:r.roomUse||{},
            status:"pending", holdUntil:null,
            createdAt:serverTimestamp(), updatedAt:serverTimestamp() };
          const paid = r.last5 || (S.qst==="confirmed");
          data.status = paid ? "confirmed" : "pending";
          data.holdUntil = paid ? null : holdUntilFor(a,r.date);
          const mm={ fee:null, feeNote:"", deposits: (r.last5 || r.depAmt!=null) ? [{ amount: r.depAmt ?? r.due ?? null, last5:r.last5||"", at:Date.now() }] : [] };
          data.balance=fin(a,data,mm).balance;
          b.set(ref,data); b.set(doc(db,"activities",a.id,"slots",ref.id), slotOf(data));
          b.set(doc(db,"activities",a.id,"money",ref.id), { companyId:data.companyId, ...mm, updatedAt:serverTimestamp() });
        });
        await b.commit(); sent=Math.min(rows.length, i+5);
      }
      toast(`已送出 ${rows.length} 組`); S.qtext=""; await reloadAct(); S.tab="orders"; S.ofilter="active"; S.oq=""; render();
    }catch(e){
      S.qtext=rows.slice(sent).map(r=>r.raw).join("\n");
      toast((sent?`已送出 ${sent} 組，其餘送出失敗：`:"送出失敗：")+authErr(e));
      await reloadAct().catch(()=>{}); render();
    }
  };
}

/* =====================================================================
   第三階段：派車建議與確認（只有管理者）
   activities/{aid}/dispatch/{日期_行程id}
     { date, tripId, status:"draft"|"confirmed", cars:[{ id, line, route, size, privateCar,
       fee, driver, note, orderIds:[] }], updatedAt, confirmedAt }
   確認派車時，把「第 N 車」寫進每筆訂單的 carNo、車牌寫進 carPlate，同業端顯示車牌（沒填車牌才顯示第 N 車）。
   ===================================================================== */
const DROUTES = { n1:"國一", n3:"國三" };
const pkOf = (a,name) => (a.pickups||[]).find(p=>p.name===name);
const routeOf = (a,o) => pkOf(a,o.pickup)?.route || o.route || "either";
const offOf = (a,o) => +(pkOf(a,o.pickup)?.offset) || 0;
const liveOrder = o => ["confirmed","pending"].includes(effStatus(o));
const dispKey = (d,tid) => `${d}_${tid}`;
const carCap = (a,c) => (+a.seatsPerCar||8) * (+c.size||1);
const newCarId = () => "c" + Math.random().toString(36).slice(2,9);
function addMin(hhmm, min){
  const [h,m]=String(hhmm||"07:00").split(":").map(Number); let t=(h*60+m+min)%1440; if(t<0) t+=1440;
  return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0");
}
function carLabels(cars){
  // 已經派過的車保留原本的車號，其他車補空號，避免同業看到的車號跳來跳去
  const out={}, used=new Set(), lab=(n,k)=>k>1?`第 ${n}～${n+k-1} 車`:`第 ${n} 車`;
  const span=(n,k)=>Array.from({length:k},(_,i)=>n+i);
  cars.forEach(c=>{ const k=+c.size||1; if(!c.no) return;
    if(span(c.no,k).some(x=>used.has(x))){ c.no=null; return; }
    span(c.no,k).forEach(x=>used.add(x)); out[c.id]=lab(c.no,k); });
  let n=1;
  cars.forEach(c=>{ if(out[c.id]) return; const k=+c.size||1;
    while(span(n,k).some(x=>used.has(x))) n++;
    c._no=n; out[c.id]=lab(n,k); span(n,k).forEach(x=>used.add(x)); n+=k; });
  return out;
}
const orderById = id => S.orders.find(o=>o.id===id);
// 訂單上顯示的車：同業看車牌（還沒填車牌才顯示第幾車），管理者兩個都看
// carPlate 只在 carNo 有值時才算數（同業改單時只會清 carNo）
function carTxt(o){
  if(!o.carNo) return "";
  const plate=o.carPlate||"";
  if(S.role==="admin") return plate ? `${o.carNo}（${plate}）` : o.carNo;
  return plate || o.carNo;
}
const carLoad = c => c.orderIds.reduce((n,id)=>n+(+orderById(id)?.pax||0),0);

// 系統建議（規格書第五節）
function suggestCars(a, d, tid, exclude){
  const seats=+a.seatsPerCar||8, cars=[];
  const all=S.orders.filter(o=>o.date===d && o.tripId===tid && liveOrder(o) && !exclude?.has(o.id));
  const mk=(line,route,extra={})=>{ const c={ id:newCarId(), line, route, size:1, privateCar:false, fee:null, driver:"", driverId:null, plate:"", note:"", orderIds:[], ...extra }; cars.push(c); return c; };
  const free=c=>carCap(a,c)-carLoad(c);
  const regular=(line,route)=>cars.filter(c=>c.line===line && c.route===route && !c.privateCar);
  const pack=(groups,line,route)=>{
    groups.slice().sort((x,y)=>(+y.pax)-(+x.pax)).forEach(g=>{
      const pax=+g.pax||0;
      if(pax>seats){ mk(line,route,{ size:Math.ceil(pax/seats), orderIds:[g.id] }); return; }   // 超過一車：用整數台車
      (regular(line,route).find(c=>free(c)>=pax) || mk(line,route)).orderIds.push(g.id);
    });
  };
  // 同一路線的車，盡量讓每台都達到成團人數（例如 13 人排成 7＋6，而不是 8＋5）
  const balance=(line,route)=>{
    const thr=Math.min(+a.threshold?.[line]||0, seats), cs=regular(line,route);
    for(let it=0; it<60; it++){
      const low=cs.find(c=>carLoad(c)>0 && carLoad(c)<thr); if(!low) break;
      let moved=false;
      for(const c of cs){ if(c===low) continue;
        for(const id of c.orderIds){ const p=+orderById(id).pax||0;
          if(carLoad(c)-p>=thr && carLoad(low)+p<=carCap(a,low)){ c.orderIds.splice(c.orderIds.indexOf(id),1); low.orderIds.push(id); moved=true; break; } }
        if(moved) break; }
      if(!moved) break;
    }
  };
  for(const line of Object.keys(LINES)){
    const gs=all.filter(o=>o.line===line);
    gs.filter(o=>o.privateCar).forEach(o=>{ const r=routeOf(a,o);   // 自組團獨佔一台
      mk(line, r==="n1"?"n1":"n3", { privateCar:true, size:Math.max(1,Math.ceil((+o.pax||0)/seats)), orderIds:[o.id] }); });
    const reg=gs.filter(o=>!o.privateCar);
    const n1=reg.filter(o=>routeOf(a,o)==="n1"), n3=reg.filter(o=>routeOf(a,o)==="n3"), flex=reg.filter(o=>routeOf(a,o)==="either");
    pack(n1,line,"n1");                                     // 有國一固定點的客人，先開國一車
    const rest=[];
    flex.slice().sort((x,y)=>(+y.pax)-(+x.pax)).forEach(g=>{  // 國一車的空位用彈性起點（台北車站）補滿
      const c=regular(line,"n1").find(c=>free(c)>=(+g.pax||0)); if(c) c.orderIds.push(g.id); else rest.push(g); });
    pack([...n3,...rest],line,"n3");                        // 其餘排國三車
    balance(line,"n1"); balance(line,"n3");
  }
  const lo=Object.keys(LINES);
  return cars.sort((x,y)=> lo.indexOf(x.line)-lo.indexOf(y.line) || (+x.privateCar)-(+y.privateCar) || (x.route==="n1"?0:1)-(y.route==="n1"?0:1));
}

// 讀取已存的派車，拿掉已取消、改日期或改行程的訂單
function normPlan(d, tid, saved){
  const removed=[];
  const cars=(saved.cars||[]).map(c=>({ size:1, privateCar:false, fee:null, driver:"", driverId:null, plate:"", note:"", ...c, orderIds:(c.orderIds||[]).filter(id=>{
    const o=orderById(id), ok=o && o.date===d && o.tripId===tid && liveOrder(o);
    if(!ok) removed.push(o ? `${o.contact}（${effStatus(o)==="cancelled"?"已取消":effStatus(o)==="expired"?"保留逾期":"已改日期或行程"}）` : "（訂單已刪除）");
    return ok; }) }));
  // 舊資料：整天一起確認的派車，轉成每台車各自確認
  if(saved.status==="confirmed" && cars.every(c=>c.confirmed===undefined)){ let n=1; cars.forEach(c=>{ c.confirmed=true; c.no=n; n+=+c.size||1; }); }
  return { status:saved.status||"draft", confirmedAt:saved.confirmedAt||null, cars, removed };
}

const planStatus = cars => { const used=cars.filter(c=>c.orderIds.length || c.confirmed), n=used.filter(c=>c.confirmed).length;
  return n && n===used.length ? "confirmed" : n ? "partial" : "draft"; };
async function savePlan(){
  const p=S.plan, a=curAct(), status=planStatus(p.cars);
  const data={ date:p.d, tripId:p.tid, status, cars:p.cars.map(c=>({ id:c.id, line:c.line, route:c.route, size:+c.size||1, privateCar:!!c.privateCar,
    fee:numOrNull(c.fee), driver:c.driver||"", driverId:c.driverId||null, plate:c.plate||"", note:c.note||"", code:c.code||null,
    confirmed:!!c.confirmed, no:c.no||null, orderIds:c.orderIds })), updatedAt:serverTimestamp(),
    confirmedAt: p.cars.some(c=>c.confirmed) ? (p.confirmedAt||Date.now()) : null };
  await setDoc(doc(db,"activities",a.id,"dispatch",p.key), data);
  S.dispatch[p.key]=data; p.status=status; p.confirmedAt=data.confirmedAt; p.src=data;
}
// 存派車；已派出的車有變動時，車號和出車單會跟著更新
async function syncPlan(){
  const p=S.plan, prevCodes=(S.dispatch[p.key]?.cars||[]).map(c=>c.code).filter(Boolean);
  const lb=carLabels(p.cars), map={};
  p.cars.filter(c=>c.confirmed).forEach(c=>{ c.code ??= sheetCode(); c.no=c.no||c._no; c.orderIds.forEach(id=>map[id]={ no:lb[c.id], plate:String(c.plate||"").trim()||null }); });
  await savePlan();
  await writeOrderCarNos(map);
  await writeSheets([...prevCodes, ...p.cars.map(c=>c.code).filter(Boolean)]);
  syncLedger().catch(e=>console.warn(e));
}
async function planChanged(){
  try{ await syncPlan(); }catch(e){ toast(authErr(e)); }
  renderDispatch();
}

    const base = saved ? normPlan(d,tid,saved) : { status:"new", confirmedAt:null, cars:suggestCars(a,d,tid), removed:[] };
    base.cars.forEach(c=>{ if(c.no==null) delete c.no; });
    S.plan={ key, d, tid, src:saved, ...base };
  }
  const p=S.plan, labels=carLabels(p.cars), coName=id=>S.companies.find(c=>c.id===id)?.name||"";
  const inCar=new Set(p.cars.flatMap(c=>c.orderIds)), pool=live(d,tid).filter(o=>!inCar.has(o.id));

    }
  });

  const carCard=c=>{

      ${driverPicker(a, c, +t.days||1)}
      ${c.confirmed && c.code && S.sheets[c.code] ? `<div class="sheetbar"><span>出車單：${(x=>`<span class="tag ${SH_CLS[x.status]}">${SH_ST[x.status]}</span>`)(sheetCalc(S.sheets[c.code]))}</span>
        <button class="btn sm" data-sheetcopy="${c.code}">複製給司機</button><a class="btn sm" href="${esc(sheetUrl(c.code))}" target="_blank" rel="noopener">開啟</a></div>` : ""}
      ${os.length ? `<div class="scroll"><table class="cg"><tbody>${gRows(os,c)}</tbody></table></div>` : '<div class="dropmsg">把客人拖到這裡，或用客人右邊的選單移過來</div>'}
    </div>`;
  };
  const lineSum=Object.keys(LINES).map(l=>{ const x=slotStats(a,S.slots,d,tid,l); if(!x.total && !x.priv) return "";
    return `<span><strong>${LINES[l]}</strong> ${x.total} 人（確認 ${x.conf}）${x.allGo?`・${x.goCars} 車成團`:x.go?`・${x.goCars} 車成團，第 ${x.goCars+1} 車差 ${x.short} 人`:`・差 ${x.short} 人成團`}${x.priv?`・自組團 ${x.priv} 組`:""}</span>`; }).filter(Boolean).join("");
  const usedCars=p.cars.filter(c=>c.orderIds.length || c.confirmed), doneN=usedCars.filter(c=>c.confirmed).length, todo=p.cars.filter(c=>!c.confirmed && c.orderIds.length);
  const banner = p.status==="new" ? '<div class="notice">這是系統建議，還沒儲存。調整任何地方會自動存成草稿。可以一台一台按「確認這台」，不用一次全部派完。</div>'
    : doneN && doneN===usedCars.length ? `<div class="notice ok">這天 ${doneN} 台車都已派出，同業端已顯示車號。已派的車再調整，車號和出車單會自動更新。</div>`
    : doneN ? `<div class="notice">已派 ${doneN} 台，還有 ${usedCars.length-doneN} 台還沒派。已派的車同業端已顯示車號；還沒派的車按「確認這台」。</div>`
    : '<div class="notice">草稿，還沒有派出任何一台車，同業端看不到車號。</div>';

  m.innerHTML=`
    <div class="bar"><div class="grow"><h1>派車</h1><p class="sub" style="margin:0">${esc(a.name)}・每台車只走一條國道；拖曳或用選單調整，填好車資後按「確認派車」。</p></div>
      <button class="btn" id="refresh">重新整理</button></div>
    ${pickerHtml(list)}

  m.querySelectorAll("[data-sheetcopy]").forEach(b=>b.onclick=()=>navigator.clipboard.writeText(sheetUrl(b.dataset.sheetcopy)).then(()=>toast("已複製出車單連結，可以傳給司機")));
  $("#dUnconfirm")?.addEventListener("click", async()=>{

    p.cars.forEach(c=>c.confirmed=false);

    renderDispatch(); });
}
// 把車號寫進這天這個行程的每筆訂單（沒派出去的車、沒分配到的客人清空）
async function writeOrderCarNos(map){
  const p=S.plan, a=curAct();
  const val=o=>({ carNo:map[o.id]?.no||null, carPlate:map[o.id]?.plate||null });
  const targets=S.orders.filter(o=>{ if(o.date!==p.d || o.tripId!==p.tid) return false; const v=val(o);
    return (o.carNo||null)!==v.carNo || (v.carNo && (o.carPlate||null)!==v.carPlate); });
  for(let i=0;i<targets.length;i+=400){
    const b=writeBatch(db);
    targets.slice(i,i+400).forEach(o=>b.update(doc(db,"activities",a.id,"orders",o.id), val(o)));
    await b.commit();
  }
  targets.forEach(o=>Object.assign(o,val(o)));
  // 同業改了日期的訂單，還掛著舊車號的話一起清掉
  const onCar=new Set(Object.values(S.dispatch||{}).flatMap(dp=>(dp.cars||[]).filter(c=>c.confirmed).flatMap(c=>c.orderIds||[])));
  const strays=S.orders.filter(o=>o.carNo && !onCar.has(o.id));
  if(strays.length){ const b=writeBatch(db); strays.slice(0,400).forEach(o=>b.update(doc(db,"activities",a.id,"orders",o.id),{ carNo:null })); await b.commit(); strays.forEach(o=>o.carNo=null); }
}

/* =====================================================================
   第四階段：客人報名頁（免登入）與業務推廣連結
   links/{代碼}   { activityId, companyId, sellerUid, sellerName, channel, active }
   pub/{aid}      活動對外公開的資料（管理者登入時自動同步，不含成團門檻、旗標等內部資料）
   pubco/{cid}    同業對外資料：名稱、客服電話、收款帳號
   網址：…/tour-booking/?r=代碼
   ===================================================================== */
function makePub(a){
  return { name:a.name||"", status:a.status||"draft", startDate:a.startDate||"", endDate:a.endDate||"",
    closedDates:a.closedDates||[], seatsPerCar:+a.seatsPerCar||8,
    holdHours:+a.holdHours||120, holdShortDays:+a.holdShortDays||0, holdUntilDaysBefore:+a.holdUntilDaysBefore||0,
    trips:(a.trips||[]).filter(t=>t.enabled).map(t=>({ id:t.id, days:+t.days||1, label:t.label||"", pricing:t.pricing||"person",
      pickupTime:t.pickupTime||"", price:numOrNull(t.price), deposit:numOrNull(t.deposit), carPrice:numOrNull(t.carPrice),
      carDeposit:numOrNull(t.carDeposit), roomTypes:t.pricing==="room" ? (t.roomTypes||[]) : [], itinerary:t.itinerary||[] })),
    pickups:(a.pickups||[]).filter(p=>p.public).map(p=>({ name:p.name, line:p.line, route:p.route||"either", offset:+p.offset||0 })) };
}
const makePubCo = c => ({ name:c.name||"", phone:c.phone||"", lineOA:c.lineOA||"", bank:c.bank||"" });
const pubCache={};
// 管理者登入、儲存活動或同業後，把對外資料同步一份（內容沒變就不寫）
async function syncPublic(){
  const jobs=[];
  S.activities.forEach(a=>{ const v=makePub(a), k="pub/"+a.id, j=JSON.stringify(v);
    if(pubCache[k]!==j) jobs.push(setDoc(doc(db,"pub",a.id), v).then(()=>pubCache[k]=j)); });
  S.companies.forEach(c=>{ const v=makePubCo(c), k="pubco/"+c.id, j=JSON.stringify(v);
    if(pubCache[k]!==j) jobs.push(setDoc(doc(db,"pubco",c.id), v).then(()=>pubCache[k]=j)); });
  const r=await Promise.allSettled(jobs);
  if(r.some(x=>x.status==="rejected")) console.warn("公開資料同步失敗，請確認已發布最新的 Firestore 規則", r);
}

const linkUrl = code => `${location.origin}${location.pathname}?r=${code}`;
function newCode(){ const cs="abcdefghjkmnpqrstuvwxyz23456789"; let s=""; const r=crypto.getRandomValues(new Uint8Array(10)); r.forEach(x=>s+=cs[x%cs.length]); return s; }
let qrP=null;
function loadQR(){
  if(window.QRCode) return Promise.resolve(window.QRCode);
  return qrP ??= new Promise((res,rej)=>{ const sc=document.createElement("script");
    sc.src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";
    sc.onload=()=>res(window.QRCode); sc.onerror=()=>{ qrP=null; rej(new Error("QR Code 元件載入失敗")); };
    document.head.appendChild(sc); });
}

function pubCal(a,t,line,priv){
  const s=parseYmd(a.startDate), e=parseYmd(a.endDate); if(!s || !e) return "";
  const tomorrow=new Date(); tomorrow.setHours(0,0,0,0); tomorrow.setDate(tomorrow.getDate()+1);
  const first = s>tomorrow ? s : tomorrow;
  if(first>e) return '<p class="hint">報名已截止。</p>';
  const months=[]; for(let d=new Date(first.getFullYear(),first.getMonth(),1); d<=e; d=new Date(d.getFullYear(),d.getMonth()+1,1)) months.push(ymd(d).slice(0,7));
  if(!months.includes(P.month)) P.month = (P.f.date && months.includes(P.f.date.slice(0,7))) ? P.f.date.slice(0,7) : months[0];
  const i=months.indexOf(P.month), [y,mo]=P.month.split("-").map(Number);
  const pad=new Date(y,mo-1,1).getDay(), n=new Date(y,mo,0).getDate(), closed=new Set(a.closedDates||[]);
  let h=`<div class="calnav"><button class="btn sm" ${i>0?`data-pmon="${months[i-1]}"`:"disabled"}>‹</button><strong>${y} 年 ${mo} 月</strong>
    <button class="btn sm" ${i<months.length-1?`data-pmon="${months[i+1]}"`:"disabled"}>›</button></div>
    <div class="ocal pcal">${"日一二三四五六".split("").map(w=>`<div class="wd">${w}</div>`).join("")}`;
  for(let k=0;k<pad;k++) h+='<div class="cd pad"></div>';
  for(let dd=1; dd<=n; dd++){
    const dt=new Date(y,mo-1,dd), k=ymd(dt);
    if(dt<first || dt>e || closed.has(k)){ h+=`<div class="cd off"><span class="dn">${dd}</span></div>`; continue; }
    if(isRoomTrip(t) && !Object.values(roomAvail(P.stock, P.slots, t.id, k)).some(x=>x.left>0)){
      h+=`<div class="cd off full"><span class="dn">${dd}</span><span class="pl zero">額滿</span></div>`; continue; }
    const cnt=(P.slots||[]).filter(x=>x.date===k && x.tripId===t.id && x.line===line && !x.privateCar && ["confirmed","pending"].includes(effStatus(x))).reduce((n,x)=>n+(+x.pax||0),0);
    const lab = priv ? "可預約" : cnt ? `已報名 ${cnt} 人` : "🌸 開放報名";
    h+=`<button type="button" class="cd ${P.f.date===k?"sel":""}" data-pday="${k}"><span class="dn">${dd}</span><span class="pl ${cnt&&!priv?"some":"go"}">${lab}</span></button>`;
  }
  return h+"</div>";
}

  if(!priv && !pk) err.push("請選上車地點");

      contact:String(f.contact).trim(), phone, lineId:String(f.lineId||"").trim(), note:String(f.note||"").trim(), custLast5:l5,
      rooms, roomUse,
      status:"pending", holdUntil:holdUntilFor(a, f.date), agreedAt:Date.now(),
      createdAt:serverTimestamp(), updatedAt:serverTimestamp() };
    const b=writeBatch(db);
    b.set(ref,data); b.set(doc(db,"activities",a.id,"slots",ref.id), slotOf(data));
    await b.commit();
    P.done={ ...data, id:ref.id, roomFee: rooms.length ? roomFee(t,rooms) : null, due: priv ? numOrNull(t.carDeposit) : (t.deposit!=null ? +t.deposit*pax : null), time: priv ? "" : addMin(t.pickupTime, pk.offset||0) };
    P.step="done"; window.scrollTo(0,0); renderPublic();
  }catch(e){ console.error(e); toast("送出失敗，請稍後再試，或直接聯絡客服"); btn.disabled=false; btn.textContent="送出報名"; }

/* =====================================================================
   房間庫存（依房型計價的多日遊）
   每家同業登記自己訂到的房間，報名時一間一間扣：
     activities/{aid}/rooms/{rid}   { companyId, tripId, date, type, qty, lodge, onsite, prepaid, note }  只有自家和管理者看得到（prepaid 是同業已預付的房費，算毛利用）
     activities/{aid}/stock/{cid}   { items:{ rid:{ tripId, date, type, qty } } }               只有數量，給報名頁算剩幾間
   訂單： rooms:[{ type, occ }]（每間房的房型和入住人數）、roomUse:{ rid: 間數 }
   已用的間數從人數摘要（slots.roomUse）加總，所以同業之間、客人報名頁都算得到剩幾間。
   ===================================================================== */
const isRoomTrip = t => t?.pricing==="room";
function roomFee(t, rooms){
  if(!rooms?.length) return null;
  let sum=0;
  for(const r of rooms){ const rt=(t.roomTypes||[]).find(x=>x.name===r.type); const p=numOrNull(rt?.prices?.[r.occ]); if(p==null) return null; sum+=p; }
  return sum;
}
const roomsTxt = rooms => (rooms||[]).map(r=>`${r.type}（${r.occ} 人）`).join("、");
// items：[{ id, tripId, date, type, qty }]；回傳 { 房型: { total, left, rids:[{rid,left}] } }
function roomAvail(items, slots, tripId, date, excludeId, extraUsed){
  const used={ ...(extraUsed||{}) };
  (slots||[]).forEach(s=>{ if(s.id===excludeId || !["confirmed","pending"].includes(effStatus(s))) return;
    Object.entries(s.roomUse||{}).forEach(([rid,n])=>used[rid]=(used[rid]||0)+(+n||0)); });
  const out={};
  (items||[]).filter(r=>r.tripId===tripId && r.date===date).forEach(r=>{
    const left=(+r.qty||0)-(used[r.id]||0), x=(out[r.type] ??= { total:0, left:0, rids:[] });
    x.total+=+r.qty||0; x.left+=Math.max(0,left); x.rids.push({ rid:r.id, left }); });
  return out;
}
function allocRooms(rooms, avail){
  const tmp=structuredClone(avail), use={};
  for(const r of rooms){ const x=tmp[r.type], s=x?.rids.find(k=>k.left>0); if(!s) return null; s.left--; x.left--; use[s.rid]=(use[s.rid]||0)+1; }
  return use;
}
function checkRooms(t, rooms, pax){
  for(const r of rooms){ const rt=(t.roomTypes||[]).find(x=>x.name===r.type);
    if(!rt) return `沒有「${r.type}」這種房型`;
    if(r.occ<rt.minPax || r.occ>rt.maxPax) return `${r.type}一間要住 ${rt.minPax}～${rt.maxPax} 人`; }
  const sum=rooms.reduce((n,r)=>n+r.occ,0);
  if(sum!==pax) return `房間入住人數合計 ${sum} 人，和報名人數 ${pax} 人不同`;
  return null;
}
const myRoomItems = () => (S.rooms||[]).map(r=>({ id:r.id, tripId:r.tripId, date:r.date, type:r.type, qty:r.qty }));
function stockDoc(){ const items={}; (S.rooms||[]).forEach(r=>items[r.id]={ tripId:r.tripId, date:r.date, type:r.type, qty:+r.qty||0 }); return { items }; }

/* ---------- 修改訂單：選房 ---------- */
function roomRow(t, r={}){
  const rts=t.roomTypes||[], rt=rts.find(x=>x.name===r.type)||rts[0];
  return `<div class="rmrow"><select name="rm_type">${rts.map(x=>`<option ${x.name===rt?.name?"selected":""}>${esc(x.name)}</option>`).join("")}</select>
    <select name="rm_occ">${rt?occOpts(rt,r.occ):""}</select><button type="button" class="btn sm ghost" data-rmrm>刪除</button></div>`;
}
const occOpts = (rt,v) => Array.from({length:rt.maxPax-rt.minPax+1},(_,i)=>rt.minPax+i).map(n=>`<option value="${n}" ${+v===n?"selected":""}>${n} 人入住</option>`).join("");
function fillRoomSec(a, o, tripId, date, rooms){
  const box=$("#rmSec"); if(!box) return;
  const t=findTrip(a,tripId);
  if(!isRoomTrip(t)){ box.innerHTML=""; return; }
  const av=roomAvail(myRoomItems(), S.slots, tripId, date, o.id);
  const info=Object.entries(av).map(([k,x])=>`${esc(k)} 剩 ${x.left} 間`).join("、") || "這天沒有登記房間";
  box.innerHTML=`<div class="dlgsec">房間</div>
    <p class="hint" style="font-size:13px;margin:0 0 6px">${fmtDate(date)}・${info}</p>
    <div id="rmRows">${(rooms||[]).map(r=>roomRow(t,r)).join("")}</div>
    <button type="button" class="btn sm" id="addRm" style="margin-top:6px">＋ 加一間房</button>`;
  $("#addRm").onclick=()=>$("#rmRows").insertAdjacentHTML("beforeend", roomRow(t));
  box.onclick=e=>{ if(e.target.closest("[data-rmrm]")) e.target.closest(".rmrow").remove(); };
  box.onchange=e=>{ const s=e.target.closest('[name="rm_type"]'); if(!s) return;
    const rt=(t.roomTypes||[]).find(x=>x.name===s.value), occ=s.parentElement.querySelector('[name="rm_occ"]'); occ.innerHTML=occOpts(rt, occ.value); };
}
// 讀出對話框裡的房間，檢查並配房；回傳要寫進訂單的欄位
function readRooms(a, o, fd, ch){
  const t=findTrip(a,ch.tripId);
  if(!isRoomTrip(t)) return { rooms:[], roomUse:{} };
  const rooms=fd.getAll("rm_type").map((type,i)=>({ type, occ:+fd.getAll("rm_occ")[i] }));
  if(!rooms.length) return { rooms:[], roomUse:{} };
  const e=checkRooms(t, rooms, ch.pax); if(e) throw new Error(e);
  const use=allocRooms(rooms, roomAvail(myRoomItems(), S.slots, ch.tripId, ch.date, o.id));
  if(!use) throw new Error("這天自家登記的房間不夠，請先到「我的房間」確認");
  return { rooms, roomUse:use };
}

   第五階段：司機出車單與回帳
   sheets/{代碼}：每台車一張出車單，確認派車時產生，司機用 ?d=代碼 免登入開啟

   ===================================================================== */
const sheetUrl = code => `${location.origin}${location.pathname}?d=${code}`;
function sheetCode(){ const cs="abcdefghjkmnpqrstuvwxyz23456789"; let s=""; crypto.getRandomValues(new Uint8Array(16)).forEach(x=>s+=cs[x%cs.length]); return s; }

// 這組客人在各民宿住幾間（分攤住宿尾款用）
function lodRoomsOf(o, roomById){
  const out={};
  Object.entries(o.roomUse||{}).forEach(([rid,n])=>{ const k=roomById[rid]?.lodge || "（未填民宿）"; out[k]=(out[k]||0)+(+n||0); });
  return out;
}
// 依目前的派車和訂單算出一台車的出車單內容
function buildSheet(a, p, c, label){
  const t=findTrip(a,p.tid), roomById=Object.fromEntries((S.rooms||[]).map(r=>[r.id,r]));
  const os=c.orderIds.map(orderById).filter(Boolean).sort((x,y)=>offOf(a,x)-offOf(a,y) || createdMs(x)-createdMs(y));
  const groups=os.map(o=>{ const bal=numOrNull(o.balance), meal=0;
    return { oid:o.id, time:o.pickupCustom ? "" : addMin(t?.pickupTime, offOf(a,o)), pickup:o.pickup||"", contact:o.contact||"", phone:o.phone||"",
             pax:+o.pax||0, balance:bal, mealDiff:meal, due: bal==null ? null : bal+meal, rooms:roomsTxt(o.rooms), note:o.note||"",
             companyId:o.companyId||null, lodRooms:lodRoomsOf(o, roomById) }; });
  const lod={};
  os.forEach(o=>Object.entries(o.roomUse||{}).forEach(([rid,n])=>{ const r=roomById[rid]; const k=r?.lodge || "（未填民宿）";
    const x=(lod[k] ??= { lodge:k, rooms:0, amount:0, unknown:false }); x.rooms+=+n||0;
    if(numOrNull(r?.onsite)==null) x.unknown=true; else x.amount+=(+r.onsite)*(+n||0); }));
  const mealEst = (+t?.days===1) ? (+a.dayMealTablePrice||0)*(+c.size||1) : 0;
  return { activityId:a.id, activityName:a.name||"", date:p.d, tripId:p.tid, tripName:t?tripName(t):"", carId:c.id, carLabel:label,
    line:c.line, route:c.route, size:+c.size||1, privateCar:!!c.privateCar, driver:c.driver||"", plate:c.plate||"", carFee:numOrNull(c.fee)??0,
    mealEst, mealLabel: (+t?.days===1) ? `合菜 ${+c.size||1} 桌` : "", groups, lodging:Object.values(lod), remitBank:a.remitBank||"",
    cancelled:false, updatedAt:serverTimestamp() };
}
// 寫出這天這個行程所有車的出車單；被拿掉的車，出車單標成已取消
async function writeSheets(codes=[]){
  const a=curAct(), p=S.plan, lb=carLabels(p.cars), b=writeBatch(db), now=new Set(); let n=0;
  p.cars.filter(c=>c.confirmed).forEach(c=>{
    const code=c.code; now.add(code);
    const data=buildSheet(a,p,c,lb[c.id]);
    if(!S.sheets[code]) Object.assign(data, { actual:null, settle:null, createdAt:serverTimestamp() });
    b.set(doc(db,"sheets",code), data, { merge:true }); n++;
    S.sheets[code]={ ...(S.sheets[code]||{ actual:null, settle:null }), ...data, id:code };
  });
  // 取消派車或刪掉的車，出車單標成已取消
  [...new Set(codes)].filter(x=>x && !now.has(x) && S.sheets[x] && !S.sheets[x].cancelled).forEach(x=>{
    b.set(doc(db,"sheets",x), { cancelled:true }, { merge:true }); S.sheets[x].cancelled=true; n++; });
  if(n) await b.commit();
}
async function cancelSheets(codes){
  const b=writeBatch(db); let n=0;
  codes.filter(x=>x && S.sheets[x]).forEach(x=>{ b.set(doc(db,"sheets",x), { cancelled:true }, { merge:true }); S.sheets[x].cancelled=true; n++; });
  if(n) await b.commit();
}

function sheetCalc(sh){
  const act=sh.actual||null, gs=sh.groups||[];
  const expIncome=gs.reduce((n,g)=>n+(+g.due||0),0), unknown=gs.filter(g=>g.due==null).length;
  const lodEst=(sh.lodging||[]).reduce((n,l)=>n+(+l.amount||0),0);
  const income = act ? gs.reduce((n,g)=>n+(+(act.collected?.[g.oid] ?? g.due ?? 0)||0),0) : expIncome;
  const meal = act ? (+act.mealPaid||0) : (+sh.mealEst||0);
  const lodging = act ? Object.values(act.lodging||{}).reduce((n,v)=>n+(+v||0),0) : lodEst;
  const remit = income - (+sh.carFee||0) - meal - lodging;
  const status = sh.cancelled ? "cancelled" : sh.settle==="remitted" ? "remitted" : sh.settle==="transferred" ? "transferred"
    : !act ? "unreported" : remit<0 ? "owe" : "toRemit";
  return { expIncome, unknown, lodEst, income, meal, lodging, remit, status, reported:!!act };
}
/* 同業帳：每家同業 × 每天 × 每個行程 × 每條線一筆
   拼團：同一天、同一行程、同一條線（台北線、台中線分開）的所有拼團車合併，
         車資和現場餐費加總後按人數分攤；住宿尾款仍按各家在各民宿的房間數，在每台車內分攤。
   自組團：一台車自成一筆，車資、餐費、住宿全由那家同業負擔。
   結餘 = 司機實收 − 分攤車資 − 分攤餐費 − 住宿尾款
   正數：公司應付同業；負數：同業應付公司。一筆內所有同業結餘加總 = 這幾台車的回帳金額合計。
   舊的出車單沒有存同業、房間數、是否自組團，就從目前的訂單補上。 */
function intSplit(total, weights){
  // 把整數 total 依權重分配，四捨五入後合計不變（最大餘數法）
  const W=weights.reduce((n,w)=>n+w,0); if(!W || !total) return weights.map(()=>0);
  const raw=weights.map(w=>total*w/W), out=raw.map(Math.floor);
  let left=total-out.reduce((n,x)=>n+x,0);
  raw.map((x,i)=>[x-Math.floor(x),i]).sort((x,y)=>y[0]-x[0]).forEach(([,i])=>{ if(left>0){ out[i]++; left--; } });
  return out;
}
const coNameOf = cid => cid ? (S.companies?.find(co=>co.id===cid)?.name || "（同業已刪除）") : "（未知同業）";
const sheetPrivate = sh => sh.privateCar ?? ((sh.groups||[]).length>0 && (sh.groups||[]).every(g=>orderById(g.oid)?.privateCar));
// 一台車上每組客人的實收和住宿尾款（住宿在車內依房間數分攤）
function sheetGroups(sh){
  const act=sh.actual||{}, gs=sh.groups||[], roomById=Object.fromEntries((S.rooms||[]).map(r=>[r.id,r]));
  const info=gs.map(g=>{ const o=orderById(g.oid);
    return { oid:g.oid, cid:g.companyId ?? o?.companyId ?? null, lr:g.lodRooms ?? (o ? lodRoomsOf(o, roomById) : {}),
             got: +(act.collected?.[g.oid] ?? g.due ?? 0)||0, pax:+g.pax||0, lod:0 }; });
  const lodAct = sh.actual ? (act.lodging||{}) : Object.fromEntries((sh.lodging||[]).map(l=>[l.lodge, +l.amount||0]));
  Object.entries(lodAct).forEach(([lodge,amt])=>{
    let w=info.map(x=>+x.lr?.[lodge]||0);
    if(!w.some(Boolean)) w=info.map(x=>x.pax);      // 找不到誰住這間民宿，就按人數分
    intSplit(Math.round(+amt||0), w).forEach((v,i)=>info[i].lod+=v); });
  return info;
}
// 把出車單分成一筆一筆（拼團依日期＋行程＋路線合併，自組團一台一筆）
function ledgerPools(){
  const pools={};
  Object.values(S.sheets||{}).filter(sh=>!sh.cancelled).forEach(sh=>{
    const priv=sheetPrivate(sh), k = priv ? `P|${sh.id}` : `${sh.date}|${sh.tripId}|${sh.line}`;
    (pools[k] ??= { key:k, date:sh.date, tripId:sh.tripId, tripName:sh.tripName||"", line:sh.line, priv, sheets:[] }).sheets.push(sh); });
  return Object.values(pools);
}
// 一筆裡各同業的結餘
function poolShares(pool){
  const gs=[]; let carT=0, mealT=0, est=false, remit=0;
  pool.sheets.forEach(sh=>{ const c=sheetCalc(sh); carT+=Math.round(+sh.carFee||0); mealT+=Math.round(c.meal||0); est ||= !c.reported; remit+=c.remit;
    sheetGroups(sh).forEach(g=>gs.push(g)); });
  const pax=gs.map(g=>g.pax), car=intSplit(carT,pax), meal=intSplit(mealT,pax), by={};
  gs.forEach((g,i)=>{ const k=g.cid||"?"; const r=(by[k] ??= { cid:g.cid, groups:0, pax:0, got:0, car:0, meal:0, lod:0, ods:{} });
    r.groups++; r.pax+=g.pax; r.got+=g.got; r.car+=car[i]; r.meal+=meal[i]; r.lod+=g.lod;
    const od=(r.ods[g.oid] ??= [0,0,0,0]); od[0]+=g.got; od[1]+=car[i]; od[2]+=meal[i]; od[3]+=g.lod; });
  return { rows:Object.values(by).map(r=>({ ...r, net:r.got-r.car-r.meal-r.lod })), carT, mealT, paxT:pax.reduce((n,x)=>n+x,0), est, remit };
}

/* =====================================================================
   同業帳
   activities/{aid}/ledger/{companyId}
     { companyId, name, rows:[{ date, tripName, line, priv, cars:[{label,plate}], est, poolPax, poolCar, poolMeal, pax, groups, got, car, meal, lod, net }],
       updatedAt, marks:{ d20270213:{ type:"paid"|"received", amount, at } | null } }
   管理者開「回帳」或「同業帳」、或派車有變動時，從出車單重算並寫入；同業只讀得到自家那一份。
   每天的結餘：正數 → 公司付給同業（標記「已付款」）；負數 → 同業付給公司（標記「已收款」）。
   ===================================================================== */
const dayKey = d => "d" + String(d).replace(/-/g,"");
function netHtml(n, who){
  if(!n) return '<span class="meta">0</span>';
  const pos=n>0, lab = who==="admin" ? (pos?"應付同業":"同業應付") : (pos?"公司應付你":"你應付公司");
  return `<span style="color:${pos?"var(--ok)":"var(--warn)"};font-weight:700">${pos?"+":"−"}${yuan(Math.abs(n))}</span><span class="meta" style="margin-left:4px">${lab}</span>`;
}
function buildLedger(){
  const by={};
  ledgerPools().forEach(pool=>{ const P2=poolShares(pool);
    const cars=pool.sheets.map(sh=>({ label:sh.carLabel||"", plate:sh.plate||"" }))
      .sort((x,y)=>x.label.localeCompare(y.label,"zh-Hant",{numeric:true}));
    P2.rows.forEach(r=>{ const k=r.cid||"?";
      (by[k] ??= []).push({ date:pool.date, tripId:pool.tripId||"", tripName:pool.tripName, line:pool.line||"", priv:!!pool.priv, cars, est:P2.est, ods:r.ods,
        poolPax:P2.paxT, poolCar:P2.carT, poolMeal:P2.mealT,
        pax:r.pax, groups:r.groups, got:r.got, car:r.car, meal:r.meal, lod:r.lod, net:r.net }); }); });
  Object.values(by).forEach(rs=>rs.sort((x,y)=>x.date.localeCompare(y.date) || x.tripName.localeCompare(y.tripName,"zh-Hant")
    || x.line.localeCompare(y.line) || (+x.priv)-(+y.priv) || (x.cars[0]?.label||"").localeCompare(y.cars[0]?.label||"","zh-Hant",{numeric:true})));
  return by;
}
// 重算並寫回各同業的帳（只寫有變動的）
async function syncLedger(){
  const a=curAct(); if(!a || S.role!=="admin" || S.ledgerErr) return;
  const by=buildLedger(), ids=new Set([...Object.keys(by).filter(k=>k!=="?"), ...Object.keys(S.ledger||{})]);
  const b=writeBatch(db); let n=0;
  ids.forEach(cid=>{ const rows=by[cid]||[], old=S.ledger[cid];
    if(old && JSON.stringify(old.rows||[])===JSON.stringify(rows) && old.name===coNameOf(cid)) return;
    const data={ companyId:cid, name:coNameOf(cid), rows, updatedAt:Date.now() };
    b.set(doc(db,"activities",a.id,"ledger",cid), data, { merge:true }); n++;
    S.ledger[cid]={ ...(old||{ id:cid, marks:{} }), ...data }; });
  if(n) await b.commit();
}
// 一家同業的帳：依日期分組，每天小計、累計、結清狀態
function ledgerDays(lg){
  const days=[], marks=lg?.marks||{}; let cum=0;
  (lg?.rows||[]).forEach(r=>{ let d=days[days.length-1]; if(!d || d.date!==r.date){ d={ date:r.date, rows:[], net:0, est:false }; days.push(d); }
    d.rows.push(r); d.net+=r.net; d.est ||= r.est; });
  days.forEach(d=>{ cum+=d.net; d.cum=cum; d.mark=marks[dayKey(d.date)]||null; d.changed=!!d.mark && d.mark.amount!==d.net; });
  const settled=days.reduce((n,d)=>n+(d.mark?+d.mark.amount||0:0),0);
  return { days, total:cum, settled, open:cum-settled,
    sum:k=>(lg?.rows||[]).reduce((n,r)=>n+(+r[k]||0),0), estN:(lg?.rows||[]).filter(r=>r.est).length };
}
function ledgerTable(lg, who){

  const carTxt2=r=>{ const cars=r.cars||[{ label:r.carLabel||"", plate:r.plate||"" }];
    const head = r.priv ? "自組團" : `${LINES[r.line]||""}拼團${cars.length>1?`・${cars.length} 台車合併`:""}`;
    return `${head}<div class="meta">${cars.map(carOne).join("、")}</div>${!r.priv&&r.poolPax?`<div class="meta">合計車資 ${yuan(r.poolCar)}・餐費 ${yuan(r.poolMeal)}・${r.poolPax} 人</div>`:""}`; };
